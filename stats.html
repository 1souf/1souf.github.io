<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>❤︎ — Statistics</title>
<link rel="icon" href="img/favicon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#111111;
    --bg-elevated:#1b1b1b;
    --sidebar:#0c0c0c;
    --text:#f2f2f2;
    --text-dim:#969696;
    --stamp:#ffffff;
    --stamp-dim:#555555;
    --hazard:#e0e0e0;
    --border:#2a2a2a;
    --border-light:#3d3d3d;
    --mono:-apple-system, BlinkMacSystemFont, 'Inter', 'Helvetica Neue', Arial, sans-serif;
    --display:-apple-system, BlinkMacSystemFont, 'Inter', 'Helvetica Neue', Arial, sans-serif;
  }
  *{box-sizing:border-box;}
  html,body{height:100%;}
  body{
    margin:0; background:var(--bg); color:var(--text); min-height:100%;
    font-family:var(--mono); font-weight:600; -webkit-font-smoothing:antialiased;
  }
  a{color:inherit; text-decoration:none;}
  ::selection{background:var(--stamp); color:#111111;}
  html{scrollbar-color:var(--border-light) transparent;}
  ::-webkit-scrollbar{width:10px; height:10px;}
  ::-webkit-scrollbar-track{background:transparent;}
  ::-webkit-scrollbar-thumb{background:var(--border-light); border:2px solid var(--bg);}
  :focus-visible{outline:2px solid var(--stamp); outline-offset:2px;}

  .page{max-width:960px; margin:0 auto; padding:20px 24px 90px; position:relative; z-index:1;}

  /* ---------- ambient background: starfield canvas ---------- */
  .star-canvas{position:fixed; inset:0; width:100%; height:100%; z-index:0; pointer-events:none; display:block;}

  .back-link{
    display:inline-flex; align-items:center; gap:7px;
    padding:7px 12px; background:var(--bg-elevated); color:var(--text-dim);
    border:1px solid var(--border-light); border-radius:3px;
    font-family:var(--mono); font-size:.72rem; letter-spacing:.03em;
    cursor:pointer; transition:color .15s ease, border-color .15s ease, transform .15s ease;
  }
  .back-link:hover{color:var(--text); border-color:var(--stamp); transform:translateX(-2px);}
  .back-link svg{width:14px; height:14px; flex-shrink:0; display:block;}

  .page-header{display:flex; align-items:center; justify-content:space-between; gap:16px; flex-wrap:wrap; margin:0 0 6px;}
  .page-title{font-family:var(--display); font-weight:900; font-size:1.9rem; letter-spacing:-.01em; margin:0;}
  .page-sub{color:var(--text-dim); font-size:.8rem; font-weight:500; display:flex; align-items:baseline; gap:8px; flex-wrap:wrap;}

  /* "Showing: …" opens the legend, which doubles as the artist picker -
     this keeps the current filter visible with the panel closed. The dot
     separator lives on the button itself so it wraps with it instead of
     being stranded at the end of the line above. */
  .showing-btn{
    font-family:var(--mono); font-weight:600; font-size:.8rem; color:var(--text);
    background:none; border:0; padding:0 0 1px; cursor:pointer;
    border-bottom:1px dashed var(--border-light);
    transition:border-color .15s ease, color .15s ease;
  }
  .showing-btn::before{content:"·"; color:var(--border-light); margin-right:8px;}
  .showing-btn:hover{border-color:var(--stamp);}
  .showing-btn.filtered{color:var(--stamp);}

  .summary-row{
    display:flex; gap:32px; flex-wrap:wrap; margin:26px 0 40px;
    padding:18px 22px; background:var(--bg-elevated); border:1px solid var(--border); border-radius:6px;
  }
  .summary-stat{display:flex; flex-direction:column; gap:3px;}
  .summary-num{font-family:var(--display); font-weight:800; font-size:1.5rem; color:var(--stamp); font-variant-numeric:tabular-nums; white-space:nowrap;}
  .summary-label{font-size:.62rem; color:var(--text-dim); letter-spacing:.08em; text-transform:uppercase;}

  .year-block{margin-bottom:28px; padding:22px 22px 18px; background:var(--bg-elevated); border:1px solid var(--border); border-radius:6px;}
  .year-header{display:flex; align-items:baseline; justify-content:space-between; margin-bottom:20px;}
  .year-label{font-family:var(--display); font-weight:800; font-size:1.3rem;}
  .year-total{color:var(--text-dim); font-size:.72rem; letter-spacing:.03em;}

  /* ---------- yearly chart ----------
     One line chart per year instead of twelve monthly columns. The month
     counts are plotted as a single continuous line with a soft fill under
     it, so a year reads as one shape - where the sprints were, where it
     went quiet - rather than as twelve separate bars. */
  .chart{position:relative; width:100%; height:200px;}
  .chart svg{display:block; width:100%; height:100%;}

  .chart-grid{stroke:var(--border); stroke-width:1; shape-rendering:crispEdges;}
  .chart-axis{fill:var(--text-dim); font-family:var(--mono); font-size:10px; letter-spacing:.02em;}
  .chart-line{
    fill:none; stroke:var(--stamp); stroke-width:2;
    stroke-linejoin:round; stroke-linecap:round;
  }
  .chart-dot{fill:var(--bg-elevated); stroke:var(--stamp); stroke-width:1.5;}
  .chart-dot.zero{opacity:.4;}
  .chart-cursor{stroke:var(--stamp); stroke-width:1; stroke-dasharray:3 3; opacity:0;}
  .chart-cursor.on{opacity:.5;}
  .chart-focus{opacity:0;}
  .chart-focus.on{opacity:1;}

  /* Draw-in: the path carries pathLength="1", so the dash maths works at
     any width without having to measure the path first. */
  .chart-line.draw{stroke-dasharray:1; stroke-dashoffset:1;}
  .chart-line.draw.in{stroke-dashoffset:0; transition:stroke-dashoffset .9s cubic-bezier(.3,.7,.3,1);}

  .chart-tip{
    position:absolute; z-index:2; pointer-events:none;
    padding:5px 8px; border-radius:4px;
    background:var(--bg); border:1px solid var(--border-light);
    color:var(--text); font-size:.66rem; letter-spacing:.02em; white-space:nowrap;
    transform:translate(-50%, -100%); opacity:0; transition:opacity .12s ease;
  }
  .chart-tip.on{opacity:1;}
  .chart-tip b{font-weight:700;}
  .chart-tip span{color:var(--text-dim);}

  .year-delta{color:var(--text-dim); font-size:.68rem; margin-left:8px; letter-spacing:.02em;}

  /* ---------- legend: hidden by default ----------
     The eye button in the top-left corner opens it as a floating, map-style
     key; the eye-slash button inside it (or Esc) hides it again. It floats
     above the page instead of sitting in it, so the centered layout never
     moves whether it's open or closed. */
  .legend-toggle, .legend-close{
    display:flex; align-items:center; justify-content:center; padding:0;
    color:var(--text-dim); cursor:pointer; border-radius:3px;
    transition:color .15s ease, border-color .15s ease;
  }
  .legend-toggle:hover, .legend-close:hover{color:var(--text);}
  .legend-toggle svg, .legend-close svg{width:16px; height:16px; display:block;}

  .legend-toggle{
    position:fixed; left:20px; top:20px; z-index:3; width:34px; height:34px;
    background:var(--bg-elevated); border:1px solid var(--border-light);
  }
  .legend-toggle:hover{border-color:var(--stamp);}
  .page.legend-open .legend-toggle{display:none;}

  .legend-panel{
    display:none; position:fixed; left:20px; top:20px; z-index:3;
    width:min(220px, calc(100vw - 40px)); max-height:calc(100vh - 40px); overflow-y:auto;
    padding:10px 16px 18px; background:var(--bg-elevated);
    border:1px solid var(--border); border-radius:6px;
    box-shadow:0 10px 30px rgba(0,0,0,.45);
  }
  .page.legend-open .legend-panel{display:block; animation:legend-in .16s ease-out;}
  @keyframes legend-in{
    from{opacity:0; transform:translateX(-8px);}
    to{opacity:1; transform:none;}
  }
  @media (prefers-reduced-motion: reduce){ .page.legend-open .legend-panel{animation:none;} }

  .legend-header{
    display:flex; align-items:center; justify-content:space-between;
    margin-bottom:12px; padding-bottom:8px; border-bottom:1px solid var(--border);
  }
  .legend-title{font-family:var(--display); font-weight:800; font-size:.85rem;}
  .legend-close{width:28px; height:28px; margin-right:-8px; background:none; border:1px solid transparent;}
  .legend-close:hover{border-color:var(--border-light);}

  /* The list doubles as the artist picker: picking a row redraws every
     chart for just that artist, so there's nothing to colour-code any
     more - only one line is ever on screen. */
  .legend-list{display:flex; flex-direction:column; gap:2px;}
  .legend-item{
    display:flex; align-items:center; justify-content:space-between; gap:10px;
    width:100%; padding:7px 9px; background:none; border:0; border-radius:4px;
    font-family:var(--mono); font-weight:600; font-size:.72rem; letter-spacing:.02em;
    color:var(--text-dim); text-align:left; cursor:pointer;
    transition:color .15s ease, background .15s ease;
  }
  .legend-item:hover{color:var(--text); background:rgba(255,255,255,.05);}
  .legend-item.active{
    color:var(--text); background:rgba(255,255,255,.07);
    box-shadow:inset 2px 0 0 var(--stamp);
  }
  .legend-name{overflow:hidden; text-overflow:ellipsis; white-space:nowrap; min-width:0;}
  .legend-count{font-size:.64rem; color:var(--text-dim); font-variant-numeric:tabular-nums; flex-shrink:0;}
  .legend-sep{height:1px; background:var(--border); margin:6px 0;}

  /* On narrow windows there's no empty margin beside the page for the eye
     button, so the page gets a little extra room at the top for it instead
     of the button sitting on top of the title. */
  @media (max-width:1060px){
    .page{padding-top:68px;}
  }

  .stats-empty{padding:70px 20px; text-align:center; color:var(--text-dim); font-size:.85rem; line-height:1.6;}

  /* ---------- skeleton loading (matches index.html's .skel) ---------- */
  @keyframes skel-shimmer{
    0%{background-position:-360px 0;}
    100%{background-position:360px 0;}
  }
  .skel{
    display:inline-block; border-radius:3px; vertical-align:middle; color:transparent;
    background-color:var(--border-light);
    background-image:linear-gradient(90deg, var(--border-light) 0px, #5c5c5c 40px, var(--border-light) 80px);
    background-size:720px 100%;
    animation:skel-shimmer 1.6s linear infinite;
  }
  @media (prefers-reduced-motion: reduce){ .skel{animation:none;} }
  .chart-skel{display:block; width:100%; height:200px; border-radius:4px;}

  @media (max-width:640px){
    .chart{height:170px;}
    .chart-skel{height:170px;}
    .summary-row{gap:22px; padding:16px 18px;}
    .summary-num{font-size:1.25rem;}
  }
</style>
</head>
<body>

<canvas class="star-canvas" id="starCanvas" aria-hidden="true"></canvas>

<script>
/* =====================================================================
   Starfield background. Self-contained (wrapped in its own function so
   nothing here can clash with the stats script below) — safe
   to tweak or delete without touching anything else on the page.
   Hover your cursor near a star and a line snaps to it.
   ===================================================================== */
(function(){
  const canvas = document.getElementById('starCanvas');
  const ctx = canvas.getContext('2d');
  const reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  let width, height, stars = [];
  const mouse = { x: null, y: null };

  // Tuning knobs — safe to change these numbers to adjust the look.
  const STAR_COUNT = 45;
  const CONNECTION_DISTANCE = 150;       // star-to-star line range (px)
  const MOUSE_CONNECTION_DISTANCE = 190; // cursor-to-star line range (px)
  const CONNECTION_DISTANCE_SQ = CONNECTION_DISTANCE * CONNECTION_DISTANCE;
  const MOUSE_CONNECTION_DISTANCE_SQ = MOUSE_CONNECTION_DISTANCE * MOUSE_CONNECTION_DISTANCE;

  function resize(){
    const dpr = window.devicePixelRatio || 1;
    canvas.width = window.innerWidth * dpr;
    canvas.height = window.innerHeight * dpr;
    canvas.style.width = window.innerWidth + 'px';
    canvas.style.height = window.innerHeight + 'px';
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    width = window.innerWidth;
    height = window.innerHeight;
    createStars();
  }

  function createStars(){
    stars = [];
    for (let i = 0; i < STAR_COUNT; i++){
      const angle = Math.random() * Math.PI * 2;
      const speed = Math.random() * 0.14 + 0.04;
      stars.push({
        x: Math.random() * width,
        y: Math.random() * height,
        radius: Math.random() * 1.1 + 0.35,
        vx: Math.cos(angle) * speed,
        vy: Math.sin(angle) * speed,
        drift: Math.random() * Math.PI * 2,            // gentle wandering
        driftSpeed: Math.random() * 0.0008 + 0.0003,
        alpha: Math.random() * 0.35 + 0.5,              // base brightness
        twinkleSpeed: Math.random() * 0.0015 + 0.0005,  // subtle shimmer
        twinkleOffset: Math.random() * Math.PI * 2
      });
    }
  }

  function drawStars(time){
    for (const star of stars){
      // Skip the drifting motion for people who've asked their OS for
      // reduced motion — the stars just sit still and twinkle stays off.
      if (!reduceMotion){
        star.drift += star.driftSpeed;
        star.x += star.vx + Math.cos(star.drift) * 0.02;
        star.y += star.vy + Math.sin(star.drift) * 0.02;

        if (star.x < -20) star.x = width + 20;
        if (star.x > width + 20) star.x = -20;
        if (star.y < -20) star.y = height + 20;
        if (star.y > height + 20) star.y = -20;
      }

      const twinkle = reduceMotion ? 0 : Math.sin(time * star.twinkleSpeed + star.twinkleOffset) * 0.06;
      const alpha = Math.max(0.35, Math.min(0.9, star.alpha + twinkle));

      ctx.beginPath();
      ctx.arc(star.x, star.y, star.radius, 0, Math.PI * 2);
      ctx.fillStyle = `rgba(220,230,255,${alpha})`;
      ctx.fill();
    }
  }

  // Star-to-star lines. Compared as squared distances first so the far
  // more common "too far apart to connect" case never pays for a sqrt —
  // only the pairs that actually end up connected need the real distance.
  function drawStarConnections(){
    for (let i = 0; i < stars.length; i++){
      const a = stars[i];
      for (let j = i + 1; j < stars.length; j++){
        const b = stars[j];
        const dx = a.x - b.x;
        const dy = a.y - b.y;
        const distSq = dx * dx + dy * dy;
        if (distSq >= CONNECTION_DISTANCE_SQ) continue;

        const d = Math.sqrt(distSq);
        const opacity = Math.pow(1 - d / CONNECTION_DISTANCE, 2) * 0.12;

        ctx.beginPath();
        ctx.moveTo(a.x, a.y);
        ctx.lineTo(b.x, b.y);
        ctx.strokeStyle = `rgba(150,180,255,${opacity})`;
        ctx.lineWidth = 0.5;
        ctx.stroke();
      }
    }
  }

  // Cursor glow + lines to nearby stars. Same squared-distance shortcut.
  function drawMouseConnections(){
    if (mouse.x === null || mouse.y === null) return;

    for (const star of stars){
      const dx = mouse.x - star.x;
      const dy = mouse.y - star.y;
      const distSq = dx * dx + dy * dy;
      if (distSq >= MOUSE_CONNECTION_DISTANCE_SQ) continue;

      const d = Math.sqrt(distSq);
      const strength = Math.pow(1 - d / MOUSE_CONNECTION_DISTANCE, 2);

      ctx.beginPath();
      ctx.arc(star.x, star.y, star.radius + strength * 3, 0, Math.PI * 2);
      ctx.fillStyle = `rgba(190,215,255,${strength * 0.3})`;
      ctx.fill();

      ctx.beginPath();
      ctx.moveTo(mouse.x, mouse.y);
      ctx.lineTo(star.x, star.y);
      ctx.strokeStyle = `rgba(170,200,255,${strength * 0.65})`;
      ctx.lineWidth = 0.7 + strength * 0.6;
      ctx.stroke();
    }
  }

  let rafId = null;
  function animate(time){
    ctx.clearRect(0, 0, width, height);
    drawStars(time);
    drawStarConnections();
    drawMouseConnections();
    rafId = requestAnimationFrame(animate);
  }

  // Pause the loop entirely while this tab isn't visible — no point
  // drawing frames nobody can see, and it saves battery/CPU.
  document.addEventListener('visibilitychange', () => {
    if (document.hidden){
      if (rafId !== null){ cancelAnimationFrame(rafId); rafId = null; }
    } else if (rafId === null){
      rafId = requestAnimationFrame(animate);
    }
  });

  window.addEventListener('mousemove', (e) => { mouse.x = e.clientX; mouse.y = e.clientY; });
  window.addEventListener('mouseleave', () => { mouse.x = null; mouse.y = null; });
  window.addEventListener('resize', resize);

  resize();
  rafId = requestAnimationFrame(animate);
})();
</script>

<div class="page">
  <button type="button" class="legend-toggle" id="legendToggle" title="Show legend" aria-label="Show legend" aria-expanded="false" aria-controls="legendPanel">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path><circle cx="12" cy="12" r="3"></circle></svg>
  </button>
  <aside class="legend-panel" id="legendPanel" aria-label="Artists">
    <div class="legend-header">
      <span class="legend-title">Artists</span>
      <button type="button" class="legend-close" id="legendClose" title="Hide legend" aria-label="Hide legend">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"></path><line x1="1" y1="1" x2="23" y2="23"></line></svg>
      </button>
    </div>
    <div class="legend-list" id="legendList"></div>
  </aside>
  <div class="page-header">
    <div class="page-title">Statistics</div>
    <a href="index.html" class="back-link">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="19" y1="12" x2="5" y2="12"></line><polyline points="12 19 5 12 12 5"></polyline></svg>
      Back to Archive
    </a>
  </div>
  <div class="page-sub">
    <span>Songs per month, built live from each track's file date</span>
    <button type="button" class="showing-btn" id="showingBtn" aria-haspopup="true">Showing: All artists</button>
  </div>

  <div id="statsContent">
    <div class="summary-row">
      <div class="summary-stat"><span class="skel" style="display:block;width:56px;height:24px;margin-bottom:6px;"></span><span class="skel" style="display:block;width:78px;height:9px;"></span></div>
      <div class="summary-stat"><span class="skel" style="display:block;width:40px;height:24px;margin-bottom:6px;"></span><span class="skel" style="display:block;width:80px;height:9px;"></span></div>
      <div class="summary-stat"><span class="skel" style="display:block;width:64px;height:24px;margin-bottom:6px;"></span><span class="skel" style="display:block;width:84px;height:9px;"></span></div>
      <div class="summary-stat"><span class="skel" style="display:block;width:92px;height:24px;margin-bottom:6px;"></span><span class="skel" style="display:block;width:118px;height:9px;"></span></div>
    </div>
    <div class="year-block">
      <div class="year-header"><span class="skel" style="width:56px;height:19px;"></span><span class="skel" style="width:66px;height:10px;"></span></div>
      <span class="skel chart-skel"></span>
    </div>
    <div class="year-block">
      <div class="year-header"><span class="skel" style="width:56px;height:19px;"></span><span class="skel" style="width:66px;height:10px;"></span></div>
      <span class="skel chart-skel"></span>
    </div>
  </div>
</div>

<script>
/* =====================================================================
   Same spreadsheet as the main archive site. The artist tabs come from
   the "Artists" tab on that sheet, exactly like index.html, so the counts
   here always match the archive. See index.html for the setup steps.
   ===================================================================== */
const CONFIG = {
  spreadsheetId: "1XOsx3BjLw7Lkb6GfvGaE0TUaRh2fYjklSr87f4_AhE0",

  // The tab in the same spreadsheet that lists the artist tabs. One artist
  // per row in column A: that text is both the sheet tab name (sheet names
  // are matched case-insensitively) and the name shown on this page.
  // Anything in the other columns is ignored. A header row ("Artist") is fine.
  artistIndexTab: "Artists"
};

// The artist list resolved from the index tab at load time (see
// resolveArtists()). Each entry is { name, sheetTab }.
let ARTISTS = [];

/* =====================================================================
   Legend / artist picker. Hidden by default; the eye button in the
   top-left corner opens it and the eye-slash button (or Esc) closes it.
   Picking a row redraws every chart for just that artist - there are no
   per-artist colours any more, since only one line is ever on screen, so
   the list doubles as the filter rather than as a colour key.
   ===================================================================== */
function esc(s){
  return String(s === null || s === undefined ? "" : s)
    .replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;");
}

// null = every artist combined, which is what a fresh visit starts on.
let selectedArtist = null;

function artistSongCount(name){
  if (!STATS) return null;
  return STATS.artistTotals[name] || 0;
}

function renderLegend(){
  const list = document.getElementById('legendList');
  const items = [`<button type="button" class="legend-item ${selectedArtist === null ? 'active' : ''}" data-artist="" aria-pressed="${selectedArtist === null}">
      <span class="legend-name">All artists</span>
      <span class="legend-count" title="Songs with a file date">${STATS ? STATS.totalDated.toLocaleString() : ''}</span>
    </button>`,
    '<div class="legend-sep"></div>'];

  ARTISTS.forEach(artist => {
    const active = selectedArtist === artist.name;
    const count = artistSongCount(artist.name);
    items.push(`<button type="button" class="legend-item ${active ? 'active' : ''}" data-artist="${esc(artist.name)}" aria-pressed="${active}">
      <span class="legend-name">${esc(artist.name)}</span>
      <span class="legend-count" title="Songs with a file date">${count === null ? '' : count.toLocaleString()}</span>
    </button>`);
  });

  list.innerHTML = items.join('');
}

function setLegendOpen(open){
  const page = document.querySelector('.page');
  const toggle = document.getElementById('legendToggle');
  const close = document.getElementById('legendClose');
  page.classList.toggle('legend-open', open);
  toggle.setAttribute('aria-expanded', String(open));
  // Keyboard users: focus follows whichever button is showing.
  (open ? close : toggle).focus();
}

function updateShowingLabel(){
  const btn = document.getElementById('showingBtn');
  if (!btn) return;
  btn.textContent = `Showing: ${selectedArtist || 'All artists'}`;
  btn.classList.toggle('filtered', selectedArtist !== null);
}

// Picking an artist re-renders the whole stats block against that artist.
// Re-rendering (rather than hiding lines) is what lets the y-axis rescale
// to the selected artist and empty years drop out entirely.
function selectArtist(name){
  if (name === selectedArtist) return;
  selectedArtist = name;
  renderLegend();
  updateShowingLabel();
  if (STATS) render(STATS);
}

document.getElementById('legendList').addEventListener('click', (e) => {
  const item = e.target.closest('.legend-item');
  if (!item) return;
  selectArtist(item.dataset.artist || null);
});

document.getElementById('legendToggle').addEventListener('click', () => setLegendOpen(true));
document.getElementById('legendClose').addEventListener('click', () => setLegendOpen(false));
document.getElementById('showingBtn').addEventListener('click', () => setLegendOpen(true));
document.addEventListener('keydown', (e) => {
  if (e.key === 'Escape' && document.querySelector('.page').classList.contains('legend-open')) setLegendOpen(false);
});

function fetchSheetData(sheetId, tabName){
  return new Promise((resolve, reject) => {
    const callbackName = 'statsSheetCallback_' + Date.now() + '_' + Math.floor(Math.random() * 1e6);
    const url =
      `https://docs.google.com/spreadsheets/d/${sheetId}/gviz/tq` +
      `?tqx=out:json;responseHandler:${callbackName}` +
      `&headers=1` +
      `&sheet=${encodeURIComponent(tabName)}`;

    const script = document.createElement('script');
    script.src = url;

    const timeout = setTimeout(() => {
      cleanup();
      reject(new Error("Google Sheets request timed out."));
    }, 10000);

    function cleanup(){
      clearTimeout(timeout);
      delete window[callbackName];
      if (script.parentNode) script.remove();
    }

    window[callbackName] = (data) => {
      try {
        if (!data || !data.table) throw new Error("Google returned no table.");
        const cols = data.table.cols || [];
        const rows = data.table.rows || [];
        const result = [];
        result.push(cols.map(c => (c && c.label) || ""));
        for (const row of rows) {
          const cells = row.c || [];
          const converted = [];
          for (let i = 0; i < cols.length; i++) {
            const cell = cells[i];
            if (!cell) converted.push("");
            else if (cell.v !== null && cell.v !== undefined && cell.v !== "") converted.push(String(cell.v));
            else if (cell.f) converted.push(String(cell.f));
            else converted.push("");
          }
          result.push(converted);
        }
        cleanup();
        resolve(result);
      } catch (err) {
        cleanup();
        reject(err);
      }
    };

    script.onerror = () => { cleanup(); reject(new Error("Could not load Google Sheet.")); };
    document.body.appendChild(script);
  });
}

/* ---------------- artist list (same spreadsheet index tab as index.html) ----------------
   gviz answers an unknown sheet name by quietly serving the FIRST tab, so a
   table that looks like an album tab means the index tab wasn't found. */

function parseArtistIndexRows(rows){
  const labels = (rows[0] || []).map(v => String(v || "").trim());
  const albumTabHeaders = /^(original era|feature\(s\)|discord link\(s\)|cover & yt link\(s\))$/i;
  if (labels.length > 6 || labels.some(l => albumTabHeaders.test(l))) return null;

  const isHeaderWord = v => /^(artist|artists|artist name|name|tab|sheet ?tab|sheet|worksheet)$/i.test(String(v || "").trim());

  const data = rows.slice(1);
  // headers=1 hands the sheet's first row over as column labels. The index
  // tab may not have a header row at all, in which case those labels are
  // really its first artist - so only drop them when they look like a header.
  if (labels.length && !isHeaderWord(labels[0])) data.unshift(labels);

  const out = [];
  for (const row of data) {
    const name = String((row || [])[0] || "").trim();
    if (!name || isHeaderWord(name)) continue;
    out.push(name);
  }
  return out;
}

// Reads the index tab and fills ARTISTS. Leaves the current list alone when
// the tab is missing/unreadable/empty (so a dropped request can't blank the
// page); returns the list either way.
async function resolveArtists(){
  const tabName = String(CONFIG.artistIndexTab || "").trim();
  if (!tabName) return ARTISTS;
  try {
    const names = parseArtistIndexRows(await fetchSheetData(CONFIG.spreadsheetId, tabName));
    if (!names || !names.length) return ARTISTS;
    const out = [];
    const seen = new Set();
    for (const name of names) {
      // The name is the tab name too, so this only guards duplicate rows.
      const key = name.toLowerCase();
      if (seen.has(key)) continue;
      seen.add(key);
      out.push({ name, sheetTab: name });
    }
    ARTISTS = out;
  } catch (err) {
    console.info(`Artist index tab "${tabName}" is unavailable.`, err);
  }
  return ARTISTS;
}

/* Same row-parsing rules as index.html's buildAlbumsFromRows (columns
   matched by their row-1 header label, cross-listed songs flagged so
   they aren't double-counted) — trimmed down to just what the chart
   needs: each song's name, its own release date, and its album's. */
function buildAlbumsFromRows(rows){
  const albums = [];
  let current = null;

  const headerLabels = (rows[0] || []).map(h => String(h || "").trim().toLowerCase());
  const col = (label) => headerLabels.indexOf(label.toLowerCase());

  const idx = {
    name:        col("Name"),
    releaseDate: col("Release & File Date"),
    originalEra: col("Original Era"),
    link:        col("Link(s)"),
  };

  for (let i = 1; i < rows.length; i++) {
    const row = rows[i] || [];
    const a = String(row[0] || "").trim();
    const b = String(row[idx.name] || "").trim();

    // Section divider row — not an album, skip it.
    if (a !== "" && a === b) { continue; }

    // Album header row.
    if (a === "" && b !== "") {
      current = {
        name: b,
        releaseDate: String(row[idx.releaseDate] || "").trim(),
        songs: []
      };
      albums.push(current);
      continue;
    }

    // Song row.
    if (a !== "" && b !== "" && current) {
      current.songs.push({
        name: b,
        releaseDate: String(row[idx.releaseDate] || "").trim(),
        originalEra: String(row[idx.originalEra] || "").trim(),
        playLink: String(row[idx.link] || "").trim()
      });
    }
  }

  // Cross-list: a song with "Original Era" set also counts toward that
  // album, flagged so the totals below don't count it twice.
  const byName = new Map();
  albums.forEach(a => byName.set(a.name.trim().toLowerCase(), a));
  albums.forEach(album => {
    album.songs.slice().forEach(song => {
      if (!song.originalEra) return;
      const target = byName.get(song.originalEra.toLowerCase());
      if (!target || target === album) return;
      target.songs.push({ ...song, crossListed: true });
    });
  });

  return albums;
}

/* Reads a song's (or, if blank, its album's) "Release & File Date"
   cell. Google's gviz endpoint sends real Date-typed cells back as a
   JS-constructor string like "Date(2024,2,15)" (month is 0-indexed)
   rather than plain text, so that's checked first; anything else
   falls through to normal date parsing, then to a bare 4-digit year
   as a last resort. Returns null if nothing usable is found. */
function parseReleaseDate(raw){
  const str = String(raw || "").trim();
  if (!str) return null;

  const gviz = str.match(/^Date\((\d+),\s*(\d+),\s*(\d+)/);
  if (gviz) return { year: +gviz[1], month: +gviz[2] };

  const d = new Date(str);
  if (!isNaN(d.getTime())) return { year: d.getFullYear(), month: d.getMonth() };

  const yearOnly = str.match(/\b(19|20)\d{2}\b/);
  return yearOnly ? { year: +yearOnly[0], month: null } : null;
}

const MONTH_LABELS = ["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];

// Same pillows.su share-link -> direct-stream-endpoint conversion as
// index.html's toStreamUrl() — kept in sync deliberately, since a track's
// duration can only ever be read off the actual audio file (see the
// comment on probeDuration below), never off the sheet.
function toStreamUrl(shareUrl){
  if (!shareUrl) return null;
  const m = shareUrl.match(/pillows\.su\/f\/([a-zA-Z0-9]+)/i);
  if (m) return `https://api.pillows.su/api/get/${m[1]}`;
  return shareUrl;
}

// Same localStorage key index.html's probeDuration() reads and writes, so
// the two pages share one cache: a track probed while browsing the
// archive is already known here, and vice versa, rather than each page
// re-probing everything from scratch.
function getDurationCache(){
  try { return JSON.parse(localStorage.getItem('archiveDurations') || '{}'); }
  catch { return {}; }
}
function cacheDuration(playLink, seconds){
  try {
    const cache = getDurationCache();
    cache[playLink] = seconds;
    localStorage.setItem('archiveDurations', JSON.stringify(cache));
  } catch {}
}

// Probes one track's audio file for its duration via a throwaway <audio
// preload="metadata">, same as index.html — only the file's header gets
// fetched, not the whole track.
function probeDurationOnce(playLink){
  return new Promise(resolve => {
    const cached = getDurationCache()[playLink];
    if (cached !== undefined) { resolve(cached); return; }
    const probe = document.createElement('audio');
    probe.preload = 'metadata';
    const cleanup = () => { probe.removeAttribute('src'); probe.load(); };
    probe.addEventListener('loadedmetadata', () => {
      const secs = probe.duration;
      if (isFinite(secs) && secs > 0) { cacheDuration(playLink, secs); resolve(secs); }
      else resolve(0);
      cleanup();
    }, { once: true });
    probe.addEventListener('error', () => { cleanup(); resolve(0); }, { once: true });
    probe.src = toStreamUrl(playLink);
  });
}

// Total runtime has to be built by probing every track's audio file
// individually (see above) — for a whole catalog that can be a lot of
// files, so this works through them a handful at a time (CONCURRENCY)
// rather than firing every probe at once, and reports the running total
// back via onUpdate after each batch so the stat can count up live
// instead of sitting blank until the very last track resolves.
async function computeTotalRuntime(songs, onUpdate){
  const CONCURRENCY = 8;
  let totalSeconds = 0;
  let done = 0;
  let i = 0;
  async function worker(){
    while (i < songs.length) {
      const song = songs[i++];
      const secs = await probeDurationOnce(song.playLink);
      totalSeconds += secs;
      done++;
      onUpdate(totalSeconds, done, songs.length);
    }
  }
  const workers = Array.from({ length: Math.min(CONCURRENCY, songs.length) }, worker);
  await Promise.all(workers);
  return totalSeconds;
}

// "1,284 hrs" — a whole-catalog total reads better as a big round number
// of hours than the H:MM:SS format index.html uses for one track/album.
function formatTotalHours(totalSeconds){
  return `${Math.round(totalSeconds / 3600).toLocaleString()} hrs`;
}

async function loadAllAlbums(){
  const results = await Promise.allSettled(
    ARTISTS.map(artist =>
      fetchSheetData(CONFIG.spreadsheetId, artist.sheetTab)
        .then(buildAlbumsFromRows)
        .then(albums => albums.map(album => ({ ...album, artist: artist.name })))
    )
  );
  const allAlbums = [];
  results.forEach(r => {
    if (r.status === 'fulfilled') allAlbums.push(...r.value);
    else console.error("A tab failed to load for stats:", r.reason);
  });
  return allAlbums;
}

function aggregate(albums){
  const buckets = {};      // "year-month" -> { [artistName]: count }
  const artistTotals = {}; // artistName -> how many dated songs they have
  let minYear = null, maxYear = null;
  let totalSongs = 0, totalDated = 0;

  albums.forEach(album => {
    album.songs.forEach(song => {
      if (song.crossListed) return;
      totalSongs++;
      const parsed = parseReleaseDate(song.releaseDate || album.releaseDate);
      if (!parsed || parsed.month === null) return;
      totalDated++;
      const key = `${parsed.year}-${parsed.month}`;
      const bucket = buckets[key] || (buckets[key] = {});
      bucket[album.artist] = (bucket[album.artist] || 0) + 1;
      artistTotals[album.artist] = (artistTotals[album.artist] || 0) + 1;
      if (minYear === null || parsed.year < minYear) minYear = parsed.year;
      if (maxYear === null || parsed.year > maxYear) maxYear = parsed.year;
    });
  });

  return { buckets, artistTotals, minYear, maxYear, totalSongs, totalDated };
}

// Sum of every artist's count in a single month's bucket.
function bucketTotal(bucket){
  return bucket ? Object.values(bucket).reduce((a, b) => a + b, 0) : 0;
}

/* =====================================================================
   Charts. One line chart per year, drawn as inline SVG sized in real CSS
   pixels rather than as a fixed viewBox scaled to fit - a 720-unit
   viewBox squeezed into a 320px phone would shrink the month labels to
   about 4px. Anything width-dependent is therefore re-painted on resize.
   ===================================================================== */

let STATS = null;        // last aggregate() result
let chartTop = 10;       // y-axis maximum, shared by every year block
let totalRuntimeSeconds = null; // survives re-renders when the filter changes

// The twelve monthly counts for one year, for whatever is selected.
function seriesFor(stats, year){
  const out = new Array(12).fill(0);
  for (let m = 0; m < 12; m++){
    const bucket = stats.buckets[`${year}-${m}`] || {};
    out[m] = selectedArtist ? (bucket[selectedArtist] || 0) : bucketTotal(bucket);
  }
  return out;
}

// Years newest-first, dropping any the selection has nothing in: an artist
// who only turns up from 2023 on shouldn't get three flat empty blocks.
function visibleYears(stats){
  const years = [];
  for (let y = stats.maxYear; y >= stats.minYear; y--){
    if (seriesFor(stats, y).some(v => v > 0)) years.push(y);
  }
  return years;
}

// Rounds a raw axis step up to the next 1/2/5 x 10^n, so the gridlines
// land on whole numbers of songs instead of 8.4s.
function niceStep(raw){
  const exp = Math.floor(Math.log10(raw));
  const base = Math.pow(10, exp);
  const n = raw / base;
  const mult = n <= 1 ? 1 : n <= 2 ? 2 : n <= 5 ? 5 : 10;
  return mult * base;
}

const CHART = { padL: 34, padR: 10, padT: 12, padB: 24 };

function render(stats){
  const slot = document.getElementById('statsContent');

  if (stats.totalSongs === 0) {
    slot.innerHTML = `<div class="stats-empty">Couldn't load any songs from the sheet.<br>If you're opening this file directly instead of through GitHub Pages (or a local server), that's expected — try it live instead.</div>`;
    return;
  }
  if (stats.totalDated === 0) {
    slot.innerHTML = `<div class="stats-empty">None of the ${stats.totalSongs.toLocaleString()} tracked songs have a usable "Release &amp; File Date" yet — fill that column in to see monthly stats here.</div>`;
    return;
  }

  const years = visibleYears(stats);

  // One shared scale for every year block: a quiet year should look quiet
  // next to a busy one, which is the whole point of showing them together.
  const viewMax = years.reduce((m, y) => Math.max(m, ...seriesFor(stats, y)), 0);
  const step = Math.max(1, niceStep(Math.max(viewMax, 1) / 5));
  chartTop = step * 5;

  // The busiest month follows the filter too - it sits directly above the
  // charts and would otherwise contradict them.
  let busiest = null;
  years.forEach(y => seriesFor(stats, y).forEach((v, m) => {
    if (!busiest || v > busiest.count) busiest = { year: y, month: m, count: v };
  }));

  const runtimeHtml = totalRuntimeSeconds === null
    ? '<span class="skel" style="display:inline-block;width:64px;height:24px;"></span>'
    : formatTotalHours(totalRuntimeSeconds);

  let html = `<div class="summary-row">
    <div class="summary-stat"><span class="summary-num">${stats.totalSongs.toLocaleString()}</span><span class="summary-label">Total Edits</span></div>
    <div class="summary-stat"><span class="summary-num">${ARTISTS.length.toLocaleString()}</span><span class="summary-label">Total Artists</span></div>
    <div class="summary-stat"><span class="summary-num" id="totalRuntimeVal">${runtimeHtml}</span><span class="summary-label">Total Runtime</span></div>
    ${busiest ? `<div class="summary-stat"><span class="summary-num">${MONTH_LABELS[busiest.month]} ${busiest.year}</span><span class="summary-label">Busiest Month · ${busiest.count}</span></div>` : ''}
  </div>`;

  if (!years.length) {
    html += `<div class="stats-empty">${esc(selectedArtist)} has no dated songs on the sheet yet.</div>`;
    slot.innerHTML = html;
    return;
  }

  years.forEach(year => {
    const values = seriesFor(stats, year);
    const total = values.reduce((a, b) => a + b, 0);
    // Change against the year before, but only when that year actually had
    // something - "+42" measured against an empty 2022 says nothing.
    const prevTotal = (year - 1 >= stats.minYear)
      ? seriesFor(stats, year - 1).reduce((a, b) => a + b, 0)
      : 0;
    const delta = prevTotal > 0 ? total - prevTotal : 0;
    const deltaHtml = delta === 0
      ? ''
      : `<span class="year-delta">${delta > 0 ? '▲' : '▼'} ${Math.abs(delta).toLocaleString()} vs ${year - 1}</span>`;

    html += `<div class="year-block">
      <div class="year-header">
        <span class="year-label">${year}</span>
        <span class="year-total">${total.toLocaleString()} song${total === 1 ? '' : 's'}${deltaHtml}</span>
      </div>
      <div class="chart" data-year="${year}" role="img" aria-label="${year}: ${total} song${total === 1 ? '' : 's'} across the year"></div>
    </div>`;
  });

  slot.innerHTML = html;
  paintCharts(true);
}

// Draws every .chart on the page. animate is false on resize re-paints,
// so dragging the window doesn't replay the line-drawing animation.
function paintCharts(animate){
  if (!STATS) return;
  document.querySelectorAll('.chart[data-year]').forEach(container => {
    const year = Number(container.dataset.year);
    paintChart(container, year, seriesFor(STATS, year), animate);
  });
}

function paintChart(container, year, values, animate){
  const W = Math.max(240, Math.round(container.clientWidth || 600));
  const H = Math.round(container.clientHeight || 200);
  const { padL, padR, padT, padB } = CHART;
  const plotW = W - padL - padR;
  const plotH = H - padT - padB;
  const stepValue = chartTop / 5;
  const x = i => padL + (i / 11) * plotW;
  const y = v => padT + plotH - (v / chartTop) * plotH;
  const gid = `chartFill-${year}`;

  const parts = [];
  parts.push(`<defs><linearGradient id="${gid}" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" style="stop-color:var(--stamp);stop-opacity:.22"/>
      <stop offset="100%" style="stop-color:var(--stamp);stop-opacity:0"/>
    </linearGradient></defs>`);

  // Horizontal gridlines + their value labels.
  for (let i = 0; i <= 5; i++){
    const v = stepValue * i;
    const gy = y(v);
    parts.push(`<line class="chart-grid" x1="${padL}" y1="${gy.toFixed(1)}" x2="${padL + plotW}" y2="${gy.toFixed(1)}"/>`);
    parts.push(`<text class="chart-axis" x="${padL - 8}" y="${(gy + 3.5).toFixed(1)}" text-anchor="end">${Math.round(v)}</text>`);
  }

  // Month labels. On a narrow chart every other month is dropped rather
  // than letting the abbreviations run into each other.
  const labelEvery = (plotW / 11) < 24 ? 2 : 1;
  MONTH_LABELS.forEach((label, i) => {
    if (i % labelEvery !== 0) return;
    parts.push(`<text class="chart-axis" x="${x(i).toFixed(1)}" y="${H - 7}" text-anchor="middle">${label}</text>`);
  });

  const pts = values.map((v, i) => [x(i), y(v)]);
  const linePath = 'M' + pts.map(p => `${p[0].toFixed(1)} ${p[1].toFixed(1)}`).join(' L ');
  const baseY = (padT + plotH).toFixed(1);
  const areaPath = `${linePath} L ${x(11).toFixed(1)} ${baseY} L ${x(0).toFixed(1)} ${baseY} Z`;

  parts.push(`<path d="${areaPath}" fill="url(#${gid})"/>`);
  parts.push(`<path class="chart-line${animate ? ' draw' : ''}" pathLength="1" d="${linePath}"/>`);
  pts.forEach((p, i) => {
    parts.push(`<circle class="chart-dot${values[i] ? '' : ' zero'}" cx="${p[0].toFixed(1)}" cy="${p[1].toFixed(1)}" r="2.6"/>`);
  });
  parts.push(`<line class="chart-cursor" x1="0" y1="${padT}" x2="0" y2="${padT + plotH}"/>`);
  parts.push(`<circle class="chart-focus" r="4.5" cx="0" cy="0"/>`);
  parts.push(`<rect x="${padL}" y="${padT}" width="${plotW}" height="${plotH}" fill="transparent"/>`);

  container.innerHTML =
    `<svg viewBox="0 0 ${W} ${H}" width="${W}" height="${H}">${parts.join('')}</svg>` +
    `<div class="chart-tip"></div>`;

  const svg = container.querySelector('svg');
  const tip = container.querySelector('.chart-tip');
  const cursor = svg.querySelector('.chart-cursor');
  const focus = svg.querySelector('.chart-focus');

  if (animate) {
    const reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
    if (!reduce) {
      requestAnimationFrame(() => requestAnimationFrame(() => {
        const line = svg.querySelector('.chart-line');
        if (line) line.classList.add('in');
      }));
    }
  }

  // Hover: nearest month wins, so the pointer never has to land exactly on
  // a dot. The crosshair + tooltip are the stock-chart part of this.
  const hide = () => {
    cursor.classList.remove('on');
    focus.classList.remove('on');
    tip.classList.remove('on');
  };
  container.addEventListener('pointerleave', hide);
  container.addEventListener('pointermove', (e) => {
    const ctm = svg.getScreenCTM();
    if (!ctm) return;
    const pt = svg.createSVGPoint();
    pt.x = e.clientX;
    pt.y = e.clientY;
    const local = pt.matrixTransform(ctm.inverse());
    const i = Math.max(0, Math.min(11, Math.round((local.x - padL) / (plotW / 11))));
    const value = values[i];
    const px = x(i);
    const py = y(value);

    cursor.setAttribute('x1', px.toFixed(1));
    cursor.setAttribute('x2', px.toFixed(1));
    focus.setAttribute('cx', px.toFixed(1));
    focus.setAttribute('cy', py.toFixed(1));
    cursor.classList.add('on');
    focus.classList.add('on');

    tip.innerHTML = `<b>${MONTH_LABELS[i]} ${year}</b> <span>· ${value} song${value === 1 ? '' : 's'}</span>`;
    tip.classList.add('on');

    const box = container.getBoundingClientRect();
    const svgBox = svg.getBoundingClientRect();
    const scale = svgBox.width / W;
    const left = (svgBox.left - box.left) + px * scale;
    const top = (svgBox.top - box.top) + py * scale;
    // Clamp against the tooltip's own measured size rather than a guessed
    // half-width, so it never hangs off either edge of the chart.
    const halfW = tip.offsetWidth / 2;
    tip.style.left = `${Math.max(halfW + 4, Math.min(box.width - halfW - 4, left))}px`;
    tip.style.top = `${Math.max(tip.offsetHeight + 4, top - 8)}px`;
  });
}

// Charts are sized in real pixels, so a width change needs a re-paint.
let chartResizeTimer = null;
window.addEventListener('resize', () => {
  clearTimeout(chartResizeTimer);
  chartResizeTimer = setTimeout(() => paintCharts(false), 150);
});

(async function boot(){
  try {
    const artists = await resolveArtists();
    if (!artists.length) {
      document.getElementById('statsContent').innerHTML = `<div class="stats-empty">No artist tabs were found. List each artist on the spreadsheet's "Artists" tab (one per row in column A, matching its sheet tab) and check the spreadsheetId in CONFIG.</div>`;
      return;
    }
    renderLegend();

    const albums = await loadAllAlbums();
    const stats = aggregate(albums);
    STATS = stats;
    // Again, now that there are counts to put beside each name.
    renderLegend();
    updateShowingLabel();
    render(stats);

    // Runtime can only be known by probing each track's actual audio file
    // (see computeTotalRuntime above), so it's filled in after everything
    // else has already painted rather than delaying the rest of the page
    // on it. Cross-listed duplicates are skipped, same as the song counts
    // in aggregate(), so a track appearing on two albums isn't counted
    // twice; tracks with no file linked yet are skipped too, since there's
    // nothing to probe.
    const songs = [];
    albums.forEach(album => album.songs.forEach(song => {
      if (!song.crossListed && song.playLink) songs.push(song);
    }));
    if (songs.length) {
      computeTotalRuntime(songs, (totalSeconds) => {
        // Kept on the outside so switching artist doesn't reset the stat
        // back to a skeleton - render() reads it back on every re-render.
        totalRuntimeSeconds = totalSeconds;
        const runtimeEl = document.getElementById('totalRuntimeVal');
        if (runtimeEl) runtimeEl.textContent = formatTotalHours(totalSeconds);
      });
    } else {
      totalRuntimeSeconds = 0;
      const runtimeEl = document.getElementById('totalRuntimeVal');
      if (runtimeEl) runtimeEl.textContent = "0 hrs";
    }
  } catch (err) {
    console.error(err);
    document.getElementById('statsContent').innerHTML = `<div class="stats-empty">Something went wrong loading the stats — check the browser console for details.</div>`;
  }
})();
</script>

</body>
</html>
