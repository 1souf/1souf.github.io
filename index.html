// Pulls the first http(s) URL out of an arbitrary cell string, trimming
// any trailing punctuation that isn't really part of the link (a
// closing paren, a comma, a period tacked on at the end of a
// sentence). Used to read an artist profile-picture link out of an
// album header's "Feature(s)" cell - see the comment above
// buildAlbumsFromRows(). Returns "" when the cell has no link in it.
function extractUrl(raw){
  const m = String(raw || "").match(/https?:\/\/\S+/i);
  if (!m) return "";
  return m[0].replace(/[)\]}>,.;!]+$/, "");
}

function toStreamUrl(shareUrl){
  if (!shareUrl) return null;
  const m = shareUrl.match(/pillows\.su\/f\/([a-zA-Z0-9]+)/i);
  if (m) return `https://api.pillows.su/api/get/${m[1]}`;
  return shareUrl;
}

// Converts a Pillowcase share link (pillows.su/f/<id>) into its direct
// download endpoint (api.pillows.su/api/download/<id>) so the browser
// starts downloading the file immediately instead of opening the
// Pillowcase page. Links that don't match the share-link pattern (e.g.
// a Mega/MediaFire album link) are passed through unchanged.
function toDownloadUrl(shareUrl){
  if (!shareUrl) return null;
  const m = shareUrl.match(/pillows\.su\/f\/([a-zA-Z0-9]+)/i);
  if (m) return `https://api.pillows.su/api/download/${m[1]}`;
  return shareUrl;
}

/* Auto-detects a track's length straight off its audio file, for rows
   where the sheet has no length for that track (the old Track Length
   column is gone now). Uses a throwaway
   <audio> element with preload="metadata" (only fetches the file's
   header, not the whole file) and caches the result in localStorage so
   a given track is only ever probed once, even across reloads. A
   manually-typed length in the sheet always wins over this - it's only
   used to fill in the blanks. */
function getDurationCache(){
  try { return JSON.parse(localStorage.getItem('archiveDurations') || '{}'); }
  catch { return {}; }
}
function cacheDuration(playLink, seconds){
  try {
    const cache = getDurationCache();
    cache[playLink] = seconds;
    localStorage.setItem('archiveDurations', JSON.stringify(cache));
  } catch {}
}

/* Caches each artist's raw sheet rows (the array-of-arrays fetchSheetData()
   resolves with, before buildAlbumsFromRows() turns them into albums) so
   the NEXT page load can paint instantly from last time's data instead of
   sitting on a skeleton while every tab is re-fetched - see boot() and
   silentlyRefreshCache() near the bottom of this script. Keyed by CONFIG
   artist name (not sheetTab) so it lines up directly with DATA's keys.
   Wrapped in try/catch same as the duration cache above: if localStorage
   is unavailable (private browsing) or the sheet is too big for it, the
   site just skips the instant-repaint and falls back to loading live -
   nothing breaks either way. */
function getSheetRowsCache(){
  try { return JSON.parse(localStorage.getItem('archiveSheetCache') || '{}'); }
  catch { return {}; }
}
function cacheSheetRows(artistName, rows){
  try {
    const cache = getSheetRowsCache();
    cache[artistName] = rows;
    localStorage.setItem('archiveSheetCache', JSON.stringify(cache));
  } catch {}
}

function probeDuration(song, onDone){
  if (!song.playLink) return;
  const cached = getDurationCache()[song.playLink];
  if (cached !== undefined) { onDone(cached); return; }

  const probe = document.createElement('audio');
  probe.preload = 'metadata';
  const cleanup = () => { probe.removeAttribute('src'); probe.load(); };
  probe.addEventListener('loadedmetadata', () => {
    const secs = probe.duration;
    if (isFinite(secs) && secs > 0) {
      cacheDuration(song.playLink, secs);
      onDone(secs);
    }
    cleanup();
  }, { once: true });
  probe.addEventListener('error', cleanup, { once: true });
  probe.src = toStreamUrl(song.playLink);
}

function toSeconds(t){
  if (!t) return 0;
  const parts = String(t).split(':').map(Number);
  if (parts.some(isNaN)) return 0;
  return parts.reduce((acc,val)=>acc*60+val, 0);
}
function formatSeconds(total){
  total = Math.max(0, Math.round(total));
  const h = Math.floor(total/3600), m = Math.floor((total%3600)/60), s = total%60;
  const mm = h > 0 ? String(m).padStart(2,'0') : m;
  const ss = String(s).padStart(2,'0');
  return h > 0 ? `${h}:${mm}:${ss}` : `${mm}:${ss}`;
}

// Treats a song's file/release date as "new" if it parses to a real date
// within the last `maxDays` days — powers the NEW badge in the tracklist.
// Dates we can't parse (blank, "TBD", etc.) just don't get a badge.
function isRecentDate(dateStr, maxDays = 7){
  if (!dateStr) return false;
  const parsed = new Date(dateStr);
  if (isNaN(parsed.getTime())) return false;
  const diffDays = (Date.now() - parsed.getTime()) / 86400000;
  return diffDays >= 0 && diffDays <= maxDays;
}

/* ---------------- rendering ---------------- */

let DATA = {}; // { artistName: [albums] }

// Total count of edits pulled across every connected artist tab. Each
// song row counts once even if it's also cross-listed into another
// album via "Original Era" (those copies are flagged crossListed so
// they don't get double-counted).
function countAllEdits(){
  let total = 0;
  for (const artist of CONFIG.artists) {
    const albums = DATA[artist.name] || [];
    albums.forEach(album => {
      if (album.isDivider) return;
      total += album.songs.filter(s => !s.crossListed).length;
    });
  }
  return total;
}

// Same idea as countAllEdits() but scoped to a single artist — powers the
// small count shown next to each name in the artist list pane. Unlike
// countAllEdits(), a cross-listed song here only gets excluded when it
// was cross-listed from an album on THIS SAME artist's own tab (that's
// still the same edit counted twice within one artist's tally). A song
// cross-listed in from a DIFFERENT artist's tab genuinely belongs to
// this artist's visible tracklist now, so it counts.
function artistEditCount(artistName){
  let total = 0;
  const albums = DATA[artistName] || [];
  albums.forEach(album => {
    if (album.isDivider) return;
    total += album.songs.filter(s => !s.crossListed || s.fromArtist !== artistName).length;
  });
  return total;
}

function updateEditCounter(){
  const numEl = el('editCounterNum');
  if (!numEl) return;
  if (numEl.classList.contains('skel')) {
    numEl.classList.remove('skel');
    numEl.style.width = '';
    numEl.style.height = '';
  }
  const target = countAllEdits();
  const startVal = parseInt(numEl.dataset.val || "0", 10) || 0;
  const duration = 650;
  const startTime = performance.now();
  function step(now){
    const progress = Math.min((now - startTime) / duration, 1);
    const eased = 1 - Math.pow(1 - progress, 3);
    const val = Math.round(startVal + (target - startVal) * eased);
    numEl.textContent = val.toLocaleString();
    if (progress < 1) requestAnimationFrame(step);
    else { numEl.textContent = target.toLocaleString(); numEl.dataset.val = String(target); }
  }
  requestAnimationFrame(step);
}

/* ---------------- deep linking (#Section&Artist&Album[&Song]) ----------------
   The URL hash mirrors whatever album is currently open, e.g.
   "#Comps&Playboi-Carti&Music" — copying the address bar always gets you
   (or whoever you send it to) straight to that album's page instead of
   landing on the default first-artist/first-album view. Three names,
   positionally, separated by "&" — no "section=...&artist=..." clutter:
   the sheet section the album sits under ("Comps", "Edits", ...), then
   the artist, then the album. The section is what tells apart a comp and
   an edit that share a title. It's left off for an album that isn't
   under any section ("#Playboi-Carti&Music"), and that same two-part
   form is what every link from before sections were in the URL looks
   like — those keep working and open the first album with that name,
   exactly like before, and the address bar upgrades itself to the full
   form once they load.

   A song adds a fourth part: "#Comps&Playboi-Carti&Music&Some-Song" (an
   album with no section uses an empty first part —
   "#&Playboi-Carti&Music&Some-Song" — so the positions never shift).
   Opening one lands on the album, scrolls to that song and loads it into
   the player bar PAUSED: a link never starts playing by itself (browsers
   block that anyway, and it'd be rude). The address bar picks the song up
   while a track from the album on screen is loaded, so copying it shares
   that song; picking an album from the sidebar, or browsing to another
   one, goes back to the plain album link (clicking the song name in the
   player bar counts as going to the song, so that keeps it). See
   syncUrlToPlayer() and loadLinkedSong().

   A fifth part disambiguates a song name that appears more than once on
   the same album (an intro reprised, two "Interlude"s, etc): it's the
   1-based position of that track among the songs sharing its name, e.g.
   the second "Interlude" is "...&Interlude&2". It's only ever added when
   the album actually has a repeated name — a song with a unique name
   never grows a fifth part, so every pre-existing link keeps working
   unchanged. A link with no fifth part (old link, or a name that isn't
   duplicated) falls back to the first playable track with that name, same
   as before. See songOccurrenceForIndex(), buildSongLink() and
   loadLinkedSong().

   Each name is run through encodeURIComponent (so a literal
   "&", "-", "+", "#", etc. inside a name can never be mistaken for
   part of the URL syntax) — any real hyphen is then re-escaped to
   "%2D" so it can't collide with the substitution below, and only
   THEN are the now-unambiguous escaped spaces ("%20") swapped for "-",
   purely so the URL reads as "Playboi-Carti" instead of
   "Playboi%20Carti" or "Playboi+Carti". Since a raw "-" only ever
   appears where we put one, and a real "&" or "-" in a name is always
   percent-escaped first, splitting on "&" stays unambiguous. */

function encodeHashPart(s){
  return encodeURIComponent(s).replace(/-/g, '%2D').replace(/%20/g, '-');
}
function decodeHashPart(s){
  return decodeURIComponent(s.replace(/-/g, '%20'));
}

// Same case-insensitive, trimmed comparison as everywhere else a song/album
// name gets matched against the hash.
function songNameKey(name){
  return (name || "").trim().toLowerCase();
}

// 1-based position of songs[idx] among the songs on that same list that
// share its name — e.g. the second "Interlude" on the tracklist is 2. Songs
// are unique unless the exact position is not important. Returns null when
// the name is unique on that list, so callers can tell "no disambiguator
// needed" apart from "it's track 1 of however many".
function songOccurrenceForIndex(songs, idx){
  if (!songs || !songs[idx]) return null;
  const key = songNameKey(songs[idx].name);
  const sameNamed = [];
  songs.forEach((s, i) => { if (songNameKey(s.name) === key) sameNamed.push(i); });
  return sameNamed.length > 1 ? sameNamed.indexOf(idx) + 1 : null;
}

function parseHashParams(){
  const raw = location.hash.replace(/^#/, '');
  if (!raw) return null;
  const parts = raw.split('&');
  if (parts.length < 2) return null;
  try {
    // Three parts = section, artist, album. Two parts = artist, album with
    // no section (see the comment above). A null section means the link
    // doesn't say, so lookups fall back to the first album with that name.
    const hasSection = parts.length >= 3;
    const section = hasSection ? decodeHashPart(parts[0]) : null;
    const artist = decodeHashPart(parts[hasSection ? 1 : 0]);
    const album = decodeHashPart(parts[hasSection ? 2 : 1]);
    // Optional fourth part: a song on that album (see loadLinkedSong()).
    const song = (parts.length >= 4 && parts[3]) ? decodeHashPart(parts[3]) : null;
    // Optional fifth part: which of that album's same-named songs this is
    // (see songOccurrenceForIndex()). Anything that isn't a positive whole
    // number is treated as absent rather than breaking the link.
    const occRaw = (parts.length >= 5 && parts[4]) ? parseInt(parts[4], 10) : NaN;
    const songOccurrence = (Number.isInteger(occRaw) && occRaw > 0) ? occRaw : null;
    if (!artist || !album) return null;
    return { artist, album, section, song, songOccurrence };
  } catch (e) {
    // A hand-edited hash with a broken %-escape makes decodeURIComponent
    // throw — treat that as "no deep link" instead of breaking the page.
    return null;
  }
}

// Case-insensitive, trimmed lookup — the hash is user/URL-facing text,
// so it shouldn't have to match sheet names byte-for-byte to resolve.
//
// sectionRaw is optional. A comp and an edit can share a title, so when the
// link names a section ("Comps", "Edits", ...) that picks between albums
// with the same name. No section given — or none of the same-named albums
// sit under it any more (section renamed, album moved on the sheet) —
// falls back to the first album with that name, so a link never dead-ends.
function findAlbumByNames(artistNameRaw, albumNameRaw, sectionRaw){
  if (!artistNameRaw || !albumNameRaw) return null;
  const artistKey = artistNameRaw.trim().toLowerCase();
  const albumKey = albumNameRaw.trim().toLowerCase();
  const artist = CONFIG.artists.find(a => a.name.trim().toLowerCase() === artistKey);
  if (!artist) return null;
  const sameName = (DATA[artist.name] || []).filter(a => !a.isDivider && a.name.trim().toLowerCase() === albumKey);
  if (!sameName.length) return null;
  const sectionKey = (sectionRaw || "").trim().toLowerCase();
  const album = (sectionKey && sameName.find(a => (a.section || "").trim().toLowerCase() === sectionKey))
    || sameName[0];
  return { artistName: artist.name, album };
}

// Writes the current artist/album into the URL without adding a new
// browser-history entry per click (replaceState never fires
// 'hashchange' either, so this can't loop with the listener below) and
// without the page jumping/scrolling the way a plain `location.hash =`
// assignment can.
function updateUrlHash(artistName, albumName, sectionName, songName, songOccurrence){
  const parts = [encodeHashPart(artistName), encodeHashPart(albumName)];
  if (songName) {
    parts.push(encodeHashPart(songName));
    // Only present when this song's name isn't unique on the album (see
    // songOccurrenceForIndex()) — a plain, unambiguous song link never
    // grows a needless fifth part.
    if (songOccurrence) parts.push(String(songOccurrence));
  }
  // A song always gets the full four-part form, even for an album with no
  // section (empty first part) — otherwise "#Artist&Album&Song" would be
  // read as section/artist/album.
  if (sectionName || songName) parts.unshift(sectionName ? encodeHashPart(sectionName) : '');
  const newHash = '#' + parts.join('&');
  if (location.hash !== newHash) history.replaceState(null, '', newHash);
}

// Same section&artist&album&song hash format updateUrlHash() writes to the
// address bar (see the comment there for why a song always gets the full
// four-part form) — but built standalone, without touching the current URL
// or browser history. Used by the "Copy Link" menu item so copying a song's
// link from wherever you're browsing never navigates you away to it.
function buildSongLink(artistName, album, songName, songIdx){
  const parts = [encodeHashPart(artistName), encodeHashPart(album.name), encodeHashPart(songName)];
  const occurrence = songOccurrenceForIndex(album.songs, songIdx);
  if (occurrence) parts.push(String(occurrence));
  parts.unshift(album.section ? encodeHashPart(album.section) : '');
  return `${location.origin}${location.pathname}#${parts.join('&')}`;
}

function copySongLink(artistName, album, song, songIdx){
  const url = buildSongLink(artistName, album, song.name, songIdx);
  if (!navigator.clipboard || !navigator.clipboard.writeText) {
    showToast("Couldn't copy the link — clipboard access isn't available.");
    return;
  }
  navigator.clipboard.writeText(url).then(
    () => showToast("Link copied."),
    () => showToast("Couldn't copy the link.")
  );
}

// Keeps the address bar in step with the player: while the loaded track
// belongs to the album that's on screen, the URL also names the track (so
// copying it shares that song); otherwise it's just the album. selectAlbum()
// always writes the album-only form — choosing an album is what makes a
// plain album link — and loading/playing a track (playSongAt), or closing
// the player, calls this to add or drop the song again.
function syncUrlToPlayer(){
  if (!selectedArtistName || !selectedAlbumName) return;
  const onScreen = currentSongIndex >= 0 && currentAlbumSongs && currentAlbumSongs === displayedAlbumSongs;
  const song = onScreen ? currentAlbumSongs[currentSongIndex] : null;
  const occurrence = song ? songOccurrenceForIndex(currentAlbumSongs, currentSongIndex) : null;
  updateUrlHash(selectedArtistName, selectedAlbumName, selectedAlbumSection, song ? song.name : null, occurrence);
}

// Second half of opening a link that names a song (the album page itself is
// already up — selectAlbum() ran first): scroll that song's row into view and
// load it into the player bar PAUSED. Nothing here ever calls play().
// Matching is case-insensitive like the album lookup. If an album has more
// than one song with that name, songOccurrence (the link's optional fifth
// part, see songOccurrenceForIndex()) picks which one — the exact track that
// was on screen when the link was copied. Without a usable occurrence (an
// old link, or one that's out of range because tracks were added/removed
// since) it falls back to the first playable one, same as before. A song
// that's no longer on the album just leaves you on the album page, and a
// song with no source file yet gets scrolled to but has nothing to load. If
// that exact track is already loaded in the player (e.g. a link to the song
// you're listening to), playback is left alone.
function loadLinkedSong(artistName, album, songNameRaw, songOccurrence){
  if (!songNameRaw) return;
  const key = songNameRaw.trim().toLowerCase();
  const matches = [];
  album.songs.forEach((s, i) => { if ((s.name || "").trim().toLowerCase() === key) matches.push(i); });
  if (!matches.length) return;
  let idx;
  if (matches.length > 1 && songOccurrence && songOccurrence >= 1 && songOccurrence <= matches.length) {
    idx = matches[songOccurrence - 1];
  } else {
    const playableIdx = matches.find(i => album.songs[i].playLink);
    idx = playableIdx !== undefined ? playableIdx : matches[0];
  }
  const song = album.songs[idx];

  const rowEl = el('content').querySelectorAll('tbody tr')[idx] || null;
  if (rowEl) rowEl.scrollIntoView({ block: 'center' });
  if (!song.playLink) return;

  const streamUrl = toStreamUrl(song.playLink);
  const alreadyLoaded = currentSongIndex >= 0 && !!audioEl.src && !!streamUrl && audioEl.src.includes(streamUrl);
  if (!alreadyLoaded) {
    playSongAt(idx, rowEl, album.songs, artistName, (album.cover || "").trim(), album, true);
  }
  syncUrlToPlayer();
}

// Reacts to the hash changing out from under the app — pasting a new
// #Section&Artist&Album into the address bar while the page is already
// open, or using the browser's back/forward buttons after following a
// couple of links. Our own updateUrlHash() calls go through
// history.replaceState(), which never fires 'hashchange', so this can't
// end up fighting itself.
window.addEventListener('hashchange', () => {
  const hashParams = parseHashParams();
  if (!hashParams) return;
  const match = findAlbumByNames(hashParams.artist, hashParams.album, hashParams.section);
  if (match) {
    selectAlbum(match.artistName, match.album);
    loadLinkedSong(match.artistName, match.album, hashParams.song, hashParams.songOccurrence);
  }
});

// Where a fresh visit (no deep link in the URL) lands. Change any
// value below to change the site's default landing album — matching is
// case-insensitive and ignores extra whitespace, so it just needs to be
// spelled the same as it is on the sheet. "section" is optional: leave it
// "" to take the first album with that name, or set it (e.g. "Comps" or
// "Edits") if the same title exists under more than one section.
const DEFAULT_ALBUM = { artist: "Playboi Carti", album: "the wonderful world of red", section: "" };

function renderAll(){
  renderTree();
  renderDemoBanner();
  updateEditCounter();
  updateChangelogBadge();

  // A deep link (or a plain reload, since selectAlbum() keeps the hash
  // in sync with whatever's open) takes priority over the default view.
  const hashParams = parseHashParams();
  if (hashParams) {
    const match = findAlbumByNames(hashParams.artist, hashParams.album, hashParams.section);
    if (match) {
      selectAlbum(match.artistName, match.album);
      loadLinkedSong(match.artistName, match.album, hashParams.song, hashParams.songOccurrence);
      return;
    }
  }

  // No hash — land on the configured default album rather than
  // whatever's alphabetically first.
  const defaultMatch = findAlbumByNames(DEFAULT_ALBUM.artist, DEFAULT_ALBUM.album, DEFAULT_ALBUM.section);
  if (defaultMatch) { selectAlbum(defaultMatch.artistName, defaultMatch.album); return; }

  // Default album isn't on the sheet right now (renamed, tab missing,
  // etc.) — fall back to the first album of the first artist so the
  // site still lands somewhere instead of showing nothing.
  for (const artist of CONFIG.artists) {
    const albums = (DATA[artist.name] || []).filter(a => !a.isDivider);
    if (albums.length) { selectAlbum(artist.name, albums[0]); return; }
  }
  el('content').innerHTML = `<div class="empty-state"><b>Nothing filed yet</b>No albums were found on the connected sheet tab(s). Check the tab name in CONFIG matches exactly.</div>`;
}

// Used by the background auto-refresh (see silentlyRefreshCache()) once
// it's confirmed the live sheet actually changed. Unlike renderAll()
// (boot's first paint and the "Reload Spreadsheet" button both use it,
// and it always jumps to the first artist/album) this keeps whatever
// the user is currently looking at and just refreshes it in place with
// the new data - counts, the open artist pane if any, and the open
// album if it's still there. Falls back to renderAll()'s default view
// only when whatever was open no longer exists in the fresh data (e.g.
// that album got renamed or removed on the sheet).
function refreshInPlace(){
  renderDemoBanner();
  updateEditCounter();
  updateChangelogBadge();
  renderArtistList();

  // Work out which album stays open first, so the sidebar pane below is
  // rebuilt against it. Same name AND section, so a comp/edit pair that
  // share a title don't swap places; falls back to the name alone in case
  // the album got moved to a different section on the sheet.
  let keepAlbum = null;
  if (selectedArtistName && selectedAlbumName) {
    const albums = (DATA[selectedArtistName] || []).filter(a => !a.isDivider);
    keepAlbum = albums.find(a => a.name === selectedAlbumName && (a.section || "") === selectedAlbumSection)
      || albums.find(a => a.name === selectedAlbumName)
      || null;
    if (keepAlbum) selectedAlbumSection = keepAlbum.section || "";
  }

  if (el('treePanes').classList.contains('at-albums') && selectedArtistName) {
    openArtistPane(selectedArtistName);
  }

  if (keepAlbum) { renderCaseFile(selectedArtistName, keepAlbum); return; }

  renderAll();
}

function renderDemoBanner(){
  const slot = el('demoBannerSlot');
  if (!isDemoMode) { slot.innerHTML = ""; return; }
  slot.innerHTML = `<div class="demo-banner"><span><b>Demo data</b> — this is sample content, not your live sheet. Set <code>spreadsheetId</code> in the CONFIG block (top of index.html) to go live.</span></div>`;
}

// Pane 1: just artist names + their total edit count. Clicking one slides
// in pane 2 (openArtistPane) instead of expanding inline — this is what
// keeps the sidebar readable no matter how many artists/albums exist.
function renderTree(){
  renderArtistList();
  // A full re-render (boot, or "Reload Spreadsheet") always lands back on
  // the artist list rather than re-opening whatever pane was showing —
  // the data backing it may have just changed.
  el('treePanes').classList.remove('at-albums');
  el('paneAlbumsList').innerHTML = "";
  el('paneArtistName').textContent = "";
  el('sidebarFooter').textContent = `${CONFIG.artists.length} artist tab(s) connected`;
}

// An artist's sidebar avatar picture is whatever extractUrl() found in
// the first (in sheet order) of that artist's album headers that has a
// link in its "Feature(s)" cell — see the comment above
// buildAlbumsFromRows() and the pfpLink field set there. Returns "" if
// none of the artist's headers have one, which just means the sidebar
// falls back to the plain initial below.
function artistProfilePic(artistName){
  const albums = DATA[artistName] || [];
  for (const album of albums) {
    if (!album.isDivider && album.pfpLink) return album.pfpLink;
  }
  return "";
}

// Muted, on-theme fallback shades for artists with no picture link set
// yet — picked by a stable hash of the artist's name so a given artist
// always lands on the same shade rather than it changing on reload.
const AVATAR_PALETTE = ["#4a4a4a","#5c4a3d","#3d4a4a","#4a4038","#3a3a4a","#454540","#4a3d42","#3d4540"];
function hashStr(str){
  let h = 0;
  for (let i = 0; i < str.length; i++) h = (h * 31 + str.charCodeAt(i)) | 0;
  return Math.abs(h);
}
function avatarColor(name){
  return AVATAR_PALETTE[hashStr(name) % AVATAR_PALETTE.length];
}
function avatarInitial(name){
  const trimmed = String(name || "").trim();
  return trimmed ? trimmed[0].toUpperCase() : "?";
}

// Shared by the sidebar artist list and the album view's byline avatar so
// both show the exact same picture (or the exact same color+initial
// fallback) for a given artist. See artistProfilePic() above for why a
// failed/missing picture just leaves the fallback showing rather than
// breaking anything.
function applyArtistAvatar(avatarEl, artistName){
  avatarEl.style.backgroundColor = avatarColor(artistName);
  avatarEl.textContent = avatarInitial(artistName);
  const pfp = artistProfilePic(artistName);
  if (pfp) {
    const preload = new Image();
    preload.onload = () => {
      avatarEl.style.backgroundImage = `url("${pfp}")`;
      avatarEl.textContent = "";
    };
    preload.src = pfp;
  }
}

function renderArtistList(){
  const pane = el('paneArtists');
  pane.innerHTML = "";
  pane.removeAttribute('aria-hidden');

  // Most songs first; artists with the same count fall back to A-Z. The
  // counts are worked out once up front (rather than inside the sort's
  // comparator) since artistEditCount() walks every song. This only
  // changes the DISPLAY order - CONFIG.artists itself is never reordered,
  // so loading, caching and deep links aren't affected.
  const ranked = CONFIG.artists
    .map(artist => ({ artist, count: artistEditCount(artist.name) }))
    .sort((a, b) =>
      b.count - a.count ||
      a.artist.name.localeCompare(b.artist.name, undefined, { sensitivity: 'base' })
    );

  ranked.forEach(({ artist, count }) => {
    const item = document.createElement('div');
    item.className = 'artist-list-item';
    item.dataset.artist = artist.name;
    if (artist.name === selectedArtistName) item.classList.add('active');

    // Built as a real element (not innerHTML) so a picture link can be
    // set via the style API instead of getting spliced into an HTML
    // string — sidesteps any quoting issues in the URL entirely, and an
    // image that fails to load just leaves the color+initial showing
    // underneath instead of breaking anything.
    const avatar = document.createElement('span');
    avatar.className = 'al-avatar';
    applyArtistAvatar(avatar, artist.name);
    item.appendChild(avatar);

    item.insertAdjacentHTML('beforeend', `<span class="al-name">${esc(artist.name)}</span><span class="al-meta">${count}</span><span class="al-chevron">›</span>`);
    item.addEventListener('click', () => openArtistPane(artist.name));
    pane.appendChild(item);
  });
}

// The skeleton markup baked into the initial HTML (4 artist rows, 8
// track rows) is just a fixed sample — on a tall sidebar or a big
// monitor it runs out well before the bottom of the pane, leaving a
// chunk of plain background showing under it while the real data is
// still loading. These two functions top each one up with just enough
// extra rows — same markup, cycled through a small set of widths so it
// doesn't look like an obviously repeating pattern — to actually cover
// the visible area, measured live rather than guessed. They only ever
// ADD rows on top of what's already there, and only run once, before
// boot() kicks off the data fetch, so the fuller skeleton is what's on
// screen for the entire load rather than popping in partway through.

const ARTIST_SKEL_NAME_WIDTHS = [105, 85, 150, 95, 120, 70, 135, 110, 90, 140];
function artistSkeletonRowHTML(i){
  const w = ARTIST_SKEL_NAME_WIDTHS[i % ARTIST_SKEL_NAME_WIDTHS.length];
  return `<div class="artist-list-item"><span class="skel" style="width:28px;height:28px;border-radius:50%;flex-shrink:0;"></span><span class="skel" style="width:${w}px;height:13px;"></span><span class="skel" style="width:20px;height:11px;margin-left:auto;"></span></div>`;
}
function fillSidebarSkeleton(){
  const pane = el('paneArtists');
  if (!pane || !pane.children.length) return;
  const rowHeight = pane.children[0].getBoundingClientRect().height;
  if (!rowHeight) return;
  // +2 so the fake list slightly overflows into scroll like a real one
  // would, instead of stopping suspiciously exactly at the fold.
  const needed = Math.ceil(pane.clientHeight / rowHeight) + 2;
  for (let i = pane.children.length; i < needed; i++) {
    pane.insertAdjacentHTML('beforeend', artistSkeletonRowHTML(i));
  }
}

const TRACK_SKEL_PATTERNS = [
  { title:70, notes:88, credit:0  }, { title:45, notes:50, credit:0  },
  { title:60, notes:35, credit:0  }, { title:52, notes:70, credit:45 },
  { title:66, notes:80, credit:0  }, { title:38, notes:55, credit:0  },
  { title:72, notes:30, credit:50 }
];
function trackSkeletonRowHTML(i){
  const p = TRACK_SKEL_PATTERNS[i % TRACK_SKEL_PATTERNS.length];
  const creditSkel = p.credit ? `<span class="skel" style="width:${p.credit}%;height:11px;"></span>` : "";
  return `<tr class="skel-row"><td class="num-cell"><span class="skel" style="width:14px;height:11px;"></span></td><td class="title-cell"><span class="skel" style="width:${p.title}%;height:12px;"></span></td><td class="notes-cell"><span class="skel" style="width:${p.notes}%;height:11px;"></span></td><td class="credit-cell">${creditSkel}</td><td class="release-cell"><span class="skel" style="width:56px;height:11px;"></span></td><td class="time-cell"><span class="skel" style="width:30px;height:11px;"></span></td><td class="discord-cell"></td></tr>`;
}
function fillTableSkeleton(){
  const tbody = document.querySelector('#content tbody');
  const mainEl = document.querySelector('.main');
  const caseFile = document.querySelector('.case-file');
  if (!tbody || !tbody.children.length || !mainEl || !caseFile) return;
  const rowHeight = tbody.children[0].getBoundingClientRect().height;
  if (!rowHeight) return;
  // Height case-file uses up before the tbody even starts (cover art,
  // title, tags, action buttons, table header) — subtract that from the
  // main pane's own visible height to get how much row-space is left.
  const usedAboveRows = caseFile.getBoundingClientRect().height - tbody.getBoundingClientRect().height;
  const available = mainEl.clientHeight - usedAboveRows;
  const needed = Math.max(tbody.children.length, Math.ceil(available / rowHeight) + 2);
  for (let i = tbody.children.length; i < needed; i++) {
    tbody.insertAdjacentHTML('beforeend', trackSkeletonRowHTML(i));
  }
}

// Pane 2: one artist's albums, grouped under its dividers (e.g. "Comps",
// "Edits") exactly like before. Rebuilt fresh each time it's opened, so
// there's only ever one artist's worth of album rows in the DOM.
function openArtistPane(artistName){
  const albums = DATA[artistName] || [];
  el('paneArtistName').textContent = artistName;
  const listEl = el('paneAlbumsList');
  listEl.innerHTML = "";
  let sectionList = listEl;
  albums.forEach(album => {
    if (album.isDivider) {
      const div = document.createElement('div');
      div.className = 'tree-divider';
      div.innerHTML = `<span class="chevron">▾</span><span class="rule"></span><span class="label">${esc(album.label)}</span><span class="rule"></span>`;
      const sub = document.createElement('div');
      sub.className = 'tree-albums';
      // Every section starts open now — collapsing "Edits" by default was
      // only there to fight clutter in the old single-pane sidebar, which
      // no longer applies now that each artist gets its own pane.
      div.addEventListener('click', () => {
        div.classList.toggle('collapsed');
        sub.classList.toggle('collapsed');
      });
      listEl.appendChild(div);
      listEl.appendChild(sub);
      sectionList = sub;
      return;
    }
    const item = document.createElement('div');
    item.className = 'tree-album-item';
    if (artistName === selectedArtistName && album.name === selectedAlbumName && (album.section || "") === selectedAlbumSection) item.classList.add('active');
    item.dataset.album = album.name;
    item.dataset.section = album.section || "";
    item.innerHTML = `<span class="a-name">${esc(album.name)}</span><span class="a-count">${album.songs.length}</span>`;
    item.addEventListener('click', () => selectAlbum(artistName, album));
    sectionList.appendChild(item);
  });
  el('treePanes').classList.add('at-albums');
}

function closeArtistPane(){
  el('treePanes').classList.remove('at-albums');
}

function selectAlbum(artistName, album){
  selectedArtistName = artistName;
  selectedAlbumName = album.name;
  selectedAlbumSection = album.section || "";
  // Matched by data-album/data-section rather than "whichever element was clicked" —
  // the sidebar's album pane only ever holds one artist's items at a
  // time (see openArtistPane()), so it just has to be showing THIS artist
  // and the item's name + section have to match. Name alone isn't enough:
  // a comp and an edit can share a title, and both would light up. Matching
  // here (instead of on the clicked element) means every way of landing on
  // an album (a sidebar click, a search result's "go to album", a deep
  // link, or the "more from this artist" row) highlights the right item
  // whenever that pane happens to be the one on screen.
  const paneShowsThisArtist = el('paneArtistName').textContent === artistName;
  document.querySelectorAll('.tree-album-item').forEach(n => n.classList.toggle('active',
    paneShowsThisArtist && n.dataset.album === album.name && n.dataset.section === selectedAlbumSection));
  document.querySelectorAll('.artist-list-item').forEach(n => n.classList.toggle('active', n.dataset.artist === artistName));
  renderCaseFile(artistName, album);
  // The page itself never scrolls - .main is the scrolling pane - so swapping
  // the album's HTML leaves it at whatever offset the last album was scrolled
  // to. Reset it here (not inside renderCaseFile) so opening an album always
  // starts at the top, while refreshInPlace()'s background re-render of the
  // *same* album still keeps the user's scroll position.
  const mainEl = document.querySelector('.main');
  if (mainEl) mainEl.scrollTop = 0;
  updateUrlHash(artistName, album.name, album.section);
  if (window.innerWidth <= 820) closeSidebar();
}

function renderCaseFile(artistName, album){
  const totalSeconds = album.songs.reduce((acc, s) => acc + toSeconds(s.length), 0);
  const coverUrl = (album.cover || "").trim();
  const hasCover = /^https?:\/\//i.test(coverUrl);

  const coverHtml = hasCover
    ? `<img src="${esc(coverUrl)}" alt="" onerror="this.parentElement.innerHTML='<div class=&quot;cover-fallback&quot;>NO COVER<br>ON FILE</div>'">`
    : `<div class="cover-fallback">NO COVER<br>ON FILE</div>`;

  // "More from this artist" row, at the bottom of the case file — every
  // other non-divider album on this artist's tab (comps included), in
  // the exact order the sheet (and the sidebar's album pane) has them
  // in, since that's the ordering the sheet owner already chose.
  const moreAlbums = (DATA[artistName] || []).filter(a => !a.isDivider && a !== album);
  const moreAlbumsHtml = moreAlbums.length ? `
    <div class="more-albums">
      <div class="more-albums-title">More from ${esc(artistName)}</div>
      <div class="more-albums-row">
        ${moreAlbums.map((a, i) => {
          const mCoverUrl = (a.cover || "").trim();
          const mHasCover = /^https?:\/\//i.test(mCoverUrl);
          const mCoverHtml = mHasCover
            ? `<img src="${esc(mCoverUrl)}" alt="" onerror="this.parentElement.innerHTML='<div class=&quot;more-album-cover-fallback&quot;>NO COVER</div>'">`
            : `<div class="more-album-cover-fallback">NO COVER</div>`;
          return `
            <div class="more-album-card" data-idx="${i}" title="${esc(a.name)}">
              <div class="more-album-cover">${mCoverHtml}</div>
              <div class="more-album-name">${esc(a.name)}</div>
              <div class="more-album-count">${a.songs.length} track${a.songs.length === 1 ? "" : "s"}</div>
            </div>`;
        }).join("")}
      </div>
    </div>` : "";

  const isComp = (album.section || "").trim().toLowerCase() === "comps";
  const releaseDateHtml = album.releaseDate ? `<span>RELEASE DATE: <b>${esc(album.releaseDate)}</b></span>` : "";
  const artistMetaHtml = `<span class="file-meta-artist">ARTIST: <span class="fm-avatar cf-artist-avatar"></span><b>${esc(artistName)}</b></span>`;
  const fileMetaHtml = isComp
    ? `${artistMetaHtml}
       ${releaseDateHtml}
       <span>TRACKS: <b>${album.songs.length}</b></span>
       <span>RUNTIME: <b id="runtimeVal">${formatSeconds(totalSeconds)}</b></span>`
    : `${artistMetaHtml}
       <span>TRACKS: <b>${album.songs.length}</b></span>
       <span>RUNTIME: <b id="runtimeVal">${formatSeconds(totalSeconds)}</b></span>
       ${releaseDateHtml}`;

  const hasDesc = !!(album.description && album.description.trim());
  const hasUpdate = !!(album.updates && album.updates.trim());
  const infoMenuHtml = (hasDesc || hasUpdate) ? `
    <div class="info-menu-wrap">
      <button class="info-menu-btn" title="Description &amp; updates">⋯</button>
      <div class="info-menu">
        ${hasDesc ? `<div class="desc-block">${esc(album.description)}</div>` : ""}
        ${hasUpdate ? `<div class="update-block">${esc(album.updates)}</div>` : ""}
      </div>
    </div>` : "";

  const actionsHtml = `
    <div class="actions">
      ${album.discordLink ? `<a class="btn" href="${esc(album.discordLink)}" target="_blank" rel="noopener" title="Discord Thread">★</a>` : ""}
      ${album.downloadLink ? `<a class="btn" href="${esc(toDownloadUrl(album.downloadLink))}" target="_blank" rel="noopener">Download</a>` : ""}
      ${infoMenuHtml}
    </div>`;

  const rowsHtml = album.songs.map((song, idx) => {
    const featuresHtml = song.features ? `<div class="t-features">${esc(artistName)}, ${esc(song.features)}</div>` : "";
    const newTagHtml = isRecentDate(song.releaseDate) ? `<span class="t-new-tag" title="File date within the last week">New</span>` : "";
    const crossedArtists = song.crossListed && song.fromArtist && song.fromArtist !== artistName;
    const compTagLabel = crossedArtists ? `${song.fromAlbum} — ${song.fromArtist}` : song.fromAlbum;
    const compTagHtml = (song.crossListed && song.fromAlbum)
      ? `<div class="t-comp-tag" title="Also appears on &quot;${esc(song.fromAlbum)}&quot;${crossedArtists ? ` by ${esc(song.fromArtist)}` : ""}">${esc(compTagLabel)}</div>`
      : "";
    const linkMenuItems = [
      song.ytLink ? `<a class="link-menu-item" href="${esc(song.ytLink)}" target="_blank" rel="noopener">${ICONS.youtube}<span>Watch on YouTube</span></a>` : "",
      song.discordLink ? `<a class="link-menu-item" href="${esc(song.discordLink)}" target="_blank" rel="noopener">${ICONS.discord}<span>View Discord Message</span></a>` : "",
      song.playLink ? `<a class="link-menu-item" href="${esc(toDownloadUrl(song.playLink))}" target="_blank" rel="noopener">${ICONS.download}<span>Download</span></a>` : "",
      song.playLink ? `<button type="button" class="link-menu-item queue-next-item" data-idx="${idx}">${ICONS.queueNext}<span>Add to Queue</span></button>` : "",
      `<button type="button" class="link-menu-item copy-link-item" data-idx="${idx}">${ICONS.link}<span>Copy Link</span></button>`,
    ].filter(Boolean).join("");
    const linksMenuHtml = linkMenuItems ? `
      <div class="link-menu-wrap">
        <button class="link-menu-btn" type="button" title="Links" aria-label="Song links">⋯</button>
        <div class="link-menu">${linkMenuItems}</div>
      </div>` : "";
    const playable = !!song.playLink;
    const hasManualLength = !!(song.length && song.length.trim());
    const timeHtml = hasManualLength
      ? esc(song.length)
      : (playable ? `<span class="t-loading">…</span>` : "");
    return `
      <tr data-idx="${idx}" class="${playable ? "" : "no-file"}" title="${playable ? "" : "No source file linked yet"}">
        <td class="num-cell"><span class="n">${song.trackNum}</span><span class="p">▶</span></td>
        <td class="title-cell"><div class="t-name">${esc(song.name)}${newTagHtml}</div>${featuresHtml}${compTagHtml}</td>
        <td class="notes-cell">${esc(song.notes)}</td>
        <td class="credit-cell">${esc(song.credits)}</td>
        <td class="release-cell">${esc(song.releaseDate)}</td>
        <td class="time-cell">${timeHtml}</td>
        <td class="discord-cell">${linksMenuHtml}</td>
      </tr>`;
  }).join("");

  el('content').innerHTML = `
    <div class="case-file">
      <div class="stamp-row">
        <div class="cover-mount">
          ${coverHtml}
        </div>
        <div class="header-col">
          <div class="stamp-title">${esc(album.name)}</div>
          <div class="file-meta">
            ${fileMetaHtml}
          </div>
          ${actionsHtml}
        </div>
      </div>
      <table class="manifest">
        <thead><tr><th>#</th><th>Title</th><th>Notes</th><th>Credits</th><th>File Date</th><th style="text-align:center;" title="Time"><svg class="th-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 7V12L14.5 13.5M21 12C21 16.9706 16.9706 21 12 21C7.02944 21 3 16.9706 3 12C3 7.02944 7.02944 3 12 3C16.9706 3 21 7.02944 21 12Z"></path></svg></th><th style="text-align:right;"></th></tr></thead>
        <tbody>${rowsHtml}</tbody>
      </table>
      ${moreAlbumsHtml}
    </div>`;

  displayedAlbumSongs = album.songs;

  const artistAvatarEl = el('content').querySelector('.cf-artist-avatar');
  if (artistAvatarEl) applyArtistAvatar(artistAvatarEl, artistName);

  el('content').querySelectorAll('.more-album-card').forEach((cardEl, i) => {
    cardEl.addEventListener('click', () => selectAlbum(artistName, moreAlbums[i]));
  });

  const moreAlbumsRow = el('content').querySelector('.more-albums-row');
  if (moreAlbumsRow) {
    // A plain vertical mouse-wheel scroll over the row moves it
    // horizontally instead, since it's the only scroll gesture a mouse
    // (as opposed to a trackpad, which can already shift-scroll or swipe)
    // has to offer.
    //
    // Only the "scrolled past the last card" end falls through to the
    // page's normal scroll, so you can keep reading on down the page.
    // The start doesn't: once you're back at the first card, continuing
    // to scroll "backward" stays inside the row instead of bubbling up
    // and yanking the whole page upward, which is what actually happens
    // if that direction is allowed through too - scrolling back to the
    // start and one notch further used to jump you away from the row
    // entirely.
    //
    // Animated the same way as the Up/Down arrow-key scroll (see
    // animateArrowScroll below) rather than jumping scrollLeft straight
    // to each new value - wheel events fire in a rapid burst, so a
    // one-tick-one-jump version feels stuttery next to a short eased
    // glide that later ticks can smoothly extend.
    let wheelTarget = null;
    let wheelFrame = null;
    function animateWheelScroll(){
      const target = wheelTarget;
      const startPos = moreAlbumsRow.scrollLeft;
      const startTime = performance.now();
      if (wheelFrame) cancelAnimationFrame(wheelFrame);
      function step(now){
        const progress = Math.min((now - startTime) / ARROW_SCROLL_DURATION, 1);
        const eased = 1 - Math.pow(1 - progress, 3);
        moreAlbumsRow.scrollLeft = startPos + (target - startPos) * eased;
        if (progress < 1) {
          wheelFrame = requestAnimationFrame(step);
        } else {
          wheelFrame = null;
          wheelTarget = null;
        }
      }
      wheelFrame = requestAnimationFrame(step);
    }
    moreAlbumsRow.addEventListener('wheel', (e) => {
      if (e.deltaY === 0) return;
      const maxScroll = moreAlbumsRow.scrollWidth - moreAlbumsRow.clientWidth;
      const base = wheelTarget !== null ? wheelTarget : moreAlbumsRow.scrollLeft;
      const atEnd = base >= maxScroll - 1;
      if (e.deltaY > 0 && atEnd) return; // let the page scroll on past the row
      e.preventDefault();
      wheelTarget = Math.max(0, Math.min(maxScroll, base + e.deltaY));
      animateWheelScroll();
    }, { passive: false });
  }

  const tbody = el('content').querySelector('tbody');
  tbody.querySelectorAll('.copy-link-item').forEach(btn => {
    btn.addEventListener('click', () => {
      const idx = parseInt(btn.dataset.idx, 10);
      const song = album.songs[idx];
      copySongLink(artistName, album, song, idx);
    });
  });
  tbody.querySelectorAll('.queue-next-item').forEach(btn => {
    btn.addEventListener('click', () => {
      const idx = parseInt(btn.dataset.idx, 10);
      queueSongNext(artistName, album, idx);
    });
  });
  const runtimeEl = el('runtimeVal');
  let liveTotalSeconds = totalSeconds;
  album.songs.forEach((song, idx) => {
    const hasManualLength = !!(song.length && song.length.trim());
    if (hasManualLength || !song.playLink) return;
    probeDuration(song, (secs) => {
      song.length = formatSeconds(secs);
      liveTotalSeconds += secs;
      const row = tbody.querySelectorAll('tr')[idx];
      const cell = row && row.querySelector('.time-cell');
      if (cell) cell.textContent = song.length;
      if (runtimeEl) runtimeEl.textContent = formatSeconds(liveTotalSeconds);
    });
  });
  tbody.querySelectorAll('tr').forEach(tr => {
    let downX = 0, downY = 0;
    tr.addEventListener('mousedown', (e) => {
      downX = e.clientX;
      downY = e.clientY;
    });
    tr.addEventListener('click', (e) => {
      if (e.target.closest('a')) return;
      // The links dropdown (trigger button + its menu) lives inside this
      // row for positioning purposes, but clicking it should open the
      // menu, not start playback - bail out before the play logic below.
      if (e.target.closest('.link-menu-wrap')) return;
      // If the user has selected (highlighted) text, or dragged the mouse
      // more than a few pixels between mousedown and this click, treat it
      // as a text-selection gesture rather than a play request.
      const selection = window.getSelection();
      if (selection && selection.toString().length > 0) return;
      const dx = Math.abs(e.clientX - downX);
      const dy = Math.abs(e.clientY - downY);
      if (dx > 5 || dy > 5) return;
      const idx = parseInt(tr.dataset.idx, 10);
      playSongAt(idx, tr, album.songs, artistName, coverUrl, album);
    });
  });
  const playAllBtn = el('playAllBtn');
  if (playAllBtn) {
    playAllBtn.addEventListener('click', (e) => {
      e.stopPropagation();
      const idx = album.songs.findIndex(s => s.playLink);
      if (idx >= 0) playSongAt(idx, tbody.querySelectorAll('tr')[idx], album.songs, artistName, coverUrl, album);
    });
  }

  // If we've navigated back to the album that's actually playing, re-attach
  // the "now playing" row highlight to its freshly-rendered row (the old
  // element was destroyed when this table was rebuilt).
  if (currentAlbumSongs === album.songs && currentSongIndex >= 0) {
    const playingRow = tbody.querySelectorAll('tr')[currentSongIndex];
    if (playingRow) {
      currentRowEl = playingRow;
      setRowPlayingVisual(currentRowEl, !audioEl.paused);
    }
  }
}

/* ---------------- player ---------------- */

/* Marquee scrolling for the title/sub line when text is wider than its box.
   Both lines are held in sync: each waits for the other to finish its leg
   of the trip before either one pauses and reverses. A soft fade is shown
   only on the edge(s) that are actually clipping text at that moment. */
const MARQUEE_HOLD_MS = 3000;
const MARQUEE_SPEED_PX_S = 45;
const MARQUEE_FADE_PX = 18;
const MASK_NONE = 'none';
const MASK_RIGHT = `linear-gradient(to right, #000 0, #000 calc(100% - ${MARQUEE_FADE_PX}px), transparent 100%)`;
const MASK_LEFT = `linear-gradient(to right, transparent 0, #000 ${MARQUEE_FADE_PX}px, #000 100%)`;
const MASK_BOTH = `linear-gradient(to right, transparent 0, #000 ${MARQUEE_FADE_PX}px, #000 calc(100% - ${MARQUEE_FADE_PX}px), transparent 100%)`;
let marqueeGeneration = 0;

function makeMarquee(maskId, innerId){
  return { mask: el(maskId), inner: el(innerId), distance: 0, timer: null };
}
const titleMarquee = makeMarquee('playerTitleMask', 'playerTitle');
const subMarquee = makeMarquee('playerSubMask', 'playerSub');

function marqueeSetFade(m, css){
  m.mask.style.maskImage = css;
  m.mask.style.webkitMaskImage = css;
}

function marqueeSetX(m, x, animated){
  m.inner.style.transition = animated ? `transform ${Math.max(300, (m.distance / MARQUEE_SPEED_PX_S) * 1000)}ms linear` : 'none';
  if (!animated) void m.inner.offsetWidth; // force reflow so the next transition isn't skipped
  m.inner.style.transform = `translateX(${x}px)`;
}

function stopMarquees(){
  marqueeGeneration++;
  [titleMarquee, subMarquee].forEach(m => {
    if (m.timer) { clearTimeout(m.timer); m.timer = null; }
    marqueeSetX(m, 0, false);
    marqueeSetFade(m, MASK_NONE);
  });
}

function marqueeRunLeg(gen, direction){
  if (gen !== marqueeGeneration) return;
  const movers = [titleMarquee, subMarquee].filter(m => m.distance > 0);
  if (movers.length === 0) return;

  let remaining = movers.length;
  const onLegDone = () => {
    if (gen !== marqueeGeneration) return;
    remaining--;
    if (remaining > 0) return;
    const t = setTimeout(() => marqueeRunLeg(gen, direction === 'forward' ? 'back' : 'forward'), MARQUEE_HOLD_MS);
    movers.forEach(m => { m.timer = t; });
  };

  movers.forEach(m => {
    marqueeSetFade(m, MASK_BOTH); // in transit: both the trailing and leading edges are clipping
    const targetX = direction === 'forward' ? -m.distance : 0;
    marqueeSetX(m, targetX, true);
    const onEnd = (e) => {
      if (e.propertyName !== 'transform') return;
      m.inner.removeEventListener('transitionend', onEnd);
      if (gen === marqueeGeneration) {
        // resting again: only the edge still hiding text should fade
        marqueeSetFade(m, direction === 'forward' ? MASK_LEFT : MASK_RIGHT);
      }
      onLegDone();
    };
    m.inner.addEventListener('transitionend', onEnd);
  });
}

function startMarquees(){
  const gen = ++marqueeGeneration;
  [titleMarquee, subMarquee].forEach(m => {
    if (m.timer) clearTimeout(m.timer);
    marqueeSetX(m, 0, false);
    marqueeSetFade(m, MASK_NONE);
  });

  // Wait a couple of frames so the new text has actually been laid out
  // before measuring, then start the initial hold at the resting position.
  requestAnimationFrame(() => requestAnimationFrame(() => {
    if (gen !== marqueeGeneration) return;
    [titleMarquee, subMarquee].forEach(m => {
      // Measured on the mask (the element that actually clips), not the
      // text node itself, since scrollWidth is only meaningful on the
      // element that establishes the clipped/scrollable box.
      const overflow = m.mask.scrollWidth - m.mask.clientWidth;
      m.distance = overflow > 1 ? overflow : 0;
      marqueeSetFade(m, m.distance > 0 ? MASK_RIGHT : MASK_NONE);
    });
    if (titleMarquee.distance === 0 && subMarquee.distance === 0) return;
    const t = setTimeout(() => marqueeRunLeg(gen, 'forward'), MARQUEE_HOLD_MS);
    titleMarquee.timer = t; subMarquee.timer = t;
  }));
}

window.addEventListener('resize', () => { if (el('player').style.display !== 'none') startMarquees(); });

function resetRowVisual(rowEl){
  if (!rowEl) return;
  rowEl.classList.remove('playing');
  const cell = rowEl.querySelector('.num-cell');
  const num = currentAlbumSongs[parseInt(rowEl.dataset.idx,10)].trackNum;
  cell.innerHTML = `<span class="n">${num}</span><span class="p">▶</span>`;
}

function setRowPlayingVisual(rowEl, playing){
  const cell = rowEl.querySelector('.num-cell');
  if (playing) {
    cell.innerHTML = `<span class="eq"><span></span><span></span><span></span></span>`;
  } else {
    cell.innerHTML = `<span class="p" style="display:inline-block;">▶</span>`;
  }
}

function playSongAt(idx, rowEl, songs, artistName, albumCoverUrl, album, startPaused, fromQueue){
  // songs/artistName/albumCoverUrl/album are only passed explicitly when the user
  // is starting playback from an album's page (a real click) or when the
  // queue is being consumed (see fromQueue below). Calls that are just
  // continuing whatever's already playing (prev/next/shuffle/repeat) omit
  // them, so they fall back to whatever album is actually loaded right
  // now — never to whatever the user happens to be browsing.
  const explicitSongs = songs !== undefined;
  if (songs === undefined) songs = currentAlbumSongs;
  if (artistName === undefined) artistName = currentArtistName;
  if (albumCoverUrl === undefined) albumCoverUrl = currentAlbumCover;

  const song = songs[idx];
  if (!song || !song.playLink) { showToast("No source file linked for this track yet."); return; }
  if (isDemoMode && song.playLink === "#") { showToast("This is demo data — connect your sheet to enable real playback."); return; }

  // If the track that's starting is one sitting in the queue, it's
  // happening now — pull it out so it doesn't play again later. Covers
  // the user manually clicking that exact row directly, not just the
  // queue being consumed further down via stepTrack()/the 'ended' handler
  // (which already remove it from songQueue themselves before calling
  // this).
  const queuedPos = songQueue.findIndex(q => q.songs === songs && q.idx === idx);
  if (queuedPos !== -1) songQueue.splice(queuedPos, 1);

  // A real, explicit navigation away from whatever the queue was about to
  // resume (the user clicked a specific row/shared link rather than this
  // call being the queue consuming itself) makes that saved "resume to
  // the old album" plan stale, so drop it — the newly-picked track is the
  // new context from here on.
  if (explicitSongs && !fromQueue) resumeContext = null;

  if (currentRowEl && currentRowEl !== rowEl) resetRowVisual(currentRowEl);

  const src = toStreamUrl(song.playLink);
  if (currentSongIndex !== idx || currentAlbumSongs !== songs || !audioEl.src.includes(src)) {
    audioEl.src = src;
  }
  if (startPaused) {
    // Opened from a shared song link: get the track fully loaded (source,
    // player bar, row highlight) but leave it for the visitor to press play.
    audioEl.preload = 'metadata';
    audioEl.pause();
  } else {
    audioEl.play().catch(() => showToast("Couldn't start playback — the source link may be broken."));
  }

  currentAlbumSongs = songs;
  currentAlbumCover = albumCoverUrl;
  currentArtistName = artistName;
  if (album) { currentAlbumName = album.name; currentAlbumSection = album.section || ""; }
  currentSongIndex = idx;
  currentRowEl = rowEl;
  if (rowEl) rowEl.classList.add('playing');
  if (startPaused) {
    // pause() fires no 'pause' event when nothing was playing, and swapping
    // the source doesn't either — so do by hand what that listener would
    // have: play icon on the button, static ▶ (not the equalizer) on the
    // row, and the progress bar back at zero.
    el('playPauseBtn').innerHTML = ICONS.play;
    if (rowEl) setRowPlayingVisual(rowEl, false);
    el('seek').value = 0;
    seekLastValue = 0;
    updateRangeFill(el('seek'));
    el('curTime').textContent = formatSeconds(0);
    el('durTime').textContent = formatSeconds(0);
  }

  el('player').style.display = 'flex';
  el('playerTitle').textContent = song.name;
  el('playerSub').textContent = `${currentArtistName}${song.features ? ", " + song.features : ""}`;
  document.title = `${song.name} • ${currentArtistName}${song.features ? ", " + song.features : ""}`;
  startMarquees();
  const playerCoverEl = el('playerCover');
  if (currentAlbumCover) { playerCoverEl.src = currentAlbumCover; }
  else { playerCoverEl.removeAttribute('src'); }
  const discordBtn = el('playerDiscord');
  if (song.discordLink) { discordBtn.href = song.discordLink; discordBtn.style.display = 'inline-flex'; }
  else discordBtn.style.display = 'none';
  const ytBtn = el('playerYoutube');
  if (song.ytLink) { ytBtn.href = song.ytLink; ytBtn.style.display = 'inline-flex'; }
  else ytBtn.style.display = 'none';
  const downloadBtn = el('playerDownload');
  if (song.playLink) { downloadBtn.href = toDownloadUrl(song.playLink); downloadBtn.style.display = 'inline-flex'; }
  else downloadBtn.style.display = 'none';
  syncUrlToPlayer();
}

// Clicking the song name in the player bar jumps to the album the track is
// playing from — same navigation as the search results' "go to album" button,
// and it never touches playback. If that album is already the one on screen,
// re-rendering it would only fling the page back to the top, so the playing
// row is scrolled into view instead.
el('playerTitle').addEventListener('click', () => {
  if (currentSongIndex < 0 || !currentAlbumName) return;
  const match = findAlbumByNames(currentArtistName, currentAlbumName, currentAlbumSection);
  if (!match) { showToast("That album isn't on the sheet anymore."); return; }
  const alreadyThere = selectedArtistName === match.artistName
    && selectedAlbumName === match.album.name
    && selectedAlbumSection === (match.album.section || "");
  if (alreadyThere && currentRowEl && currentRowEl.isConnected) {
    currentRowEl.scrollIntoView({ block: 'center', behavior: 'smooth' });
  } else {
    selectAlbum(match.artistName, match.album);
  }
  // This click means "take me to that song", so the address bar names the
  // song too (selectAlbum() alone would leave the plain album link).
  syncUrlToPlayer();
});

el('playPauseBtn').addEventListener('click', () => {
  if (!audioEl.src) return;
  if (audioEl.paused) audioEl.play(); else audioEl.pause();
});

// Spacebar play/pause — ignored while typing in the search bar or any
// other text field, and while a modifier key is held (so browser/OS
// shortcuts like Ctrl+Space still work normally).
document.addEventListener('keydown', (e) => {
  if (e.code !== 'Space' && e.key !== ' ') return;
  if (e.ctrlKey || e.metaKey || e.altKey) return;
  const tag = (e.target.tagName || '').toLowerCase();
  if (tag === 'input' || tag === 'textarea' || e.target.isContentEditable) return;
  if (!audioEl.src) return;
  e.preventDefault();
  if (audioEl.paused) audioEl.play(); else audioEl.pause();
});
// Up/Down scroll the page, Escape closes the changelog panel. .main is
// the only pane that actually scrolls (the page itself never does —
// see the comment in selectAlbum()), except while the changelog panel
// is open, in which case Up/Down scroll that instead, since it's the
// thing on top. Ignored while typing in a field so it doesn't fight
// with normal text-cursor movement.
//
// This animates scrollTop by hand over a short, fixed duration instead
// of using `behavior:'smooth'` — the browser's built-in smooth scroll
// re-negotiates its own (much longer) easing curve on every call, so
// holding the key, which fires a new keydown every ~30-50ms, kept
// stacking overlapping animations that took a second or two to settle.
// Tracking one shared target here means repeated presses just extend
// the same short glide instead of restarting it.
const ARROW_SCROLL_AMOUNT = 70;
const ARROW_SCROLL_DURATION = 180; // ms — quick, but still a visible glide rather than an instant jump
let arrowScrollEl = null;
let arrowScrollTarget = null;
let arrowScrollFrame = null;

function animateArrowScroll(){
  const scrollEl = arrowScrollEl;
  const target = arrowScrollTarget;
  const startPos = scrollEl.scrollTop;
  const startTime = performance.now();
  if (arrowScrollFrame) cancelAnimationFrame(arrowScrollFrame);
  function step(now){
    const progress = Math.min((now - startTime) / ARROW_SCROLL_DURATION, 1);
    const eased = 1 - Math.pow(1 - progress, 3); // easeOutCubic: quick start, gentle stop
    scrollEl.scrollTop = startPos + (target - startPos) * eased;
    if (progress < 1) {
      arrowScrollFrame = requestAnimationFrame(step);
    } else {
      arrowScrollFrame = null;
      arrowScrollTarget = null;
    }
  }
  arrowScrollFrame = requestAnimationFrame(step);
}

document.addEventListener('keydown', (e) => {
  if (e.key === 'Escape') { closeChangelogPanel(); return; }

  if (e.key !== 'ArrowUp' && e.key !== 'ArrowDown') return;
  if (e.ctrlKey || e.metaKey || e.altKey) return;
  const tag = (e.target.tagName || '').toLowerCase();
  if (tag === 'input' || tag === 'textarea' || e.target.isContentEditable) return;

  const changelogPanel = el('changelogPanel');
  const scrollEl = (changelogPanel && changelogPanel.classList.contains('open'))
    ? el('changelogList')
    : document.querySelector('.main');
  if (!scrollEl) return;
  e.preventDefault();

  // Switching panes (e.g. the changelog opens mid-scroll) drops any
  // animation still chasing a target on the old one.
  if (scrollEl !== arrowScrollEl) {
    if (arrowScrollFrame) cancelAnimationFrame(arrowScrollFrame);
    arrowScrollFrame = null;
    arrowScrollTarget = null;
    arrowScrollEl = scrollEl;
  }

  // Build off the in-flight target (not the currently-rendered
  // scrollTop, which lags behind it mid-animation) so a quick second
  // tap extends the same glide instead of yanking it back to wherever
  // the animation happened to be.
  const maxScroll = scrollEl.scrollHeight - scrollEl.clientHeight;
  const base = arrowScrollTarget !== null ? arrowScrollTarget : scrollEl.scrollTop;
  const delta = e.key === 'ArrowUp' ? -ARROW_SCROLL_AMOUNT : ARROW_SCROLL_AMOUNT;
  arrowScrollTarget = Math.max(0, Math.min(maxScroll, base + delta));
  animateArrowScroll();
});

audioEl.addEventListener('play', () => {
  el('playPauseBtn').innerHTML = ICONS.pause;
  if (currentRowEl) setRowPlayingVisual(currentRowEl, true);
});
audioEl.addEventListener('pause', () => {
  el('playPauseBtn').innerHTML = ICONS.play;
  if (currentRowEl) setRowPlayingVisual(currentRowEl, false);
});

// Playable-track lookup used by shuffle/repeat below.
function playableIndices(){
  if (!currentAlbumSongs) return [];
  const out = [];
  currentAlbumSongs.forEach((s, i) => { if (s.playLink) out.push(i); });
  return out;
}

// Looks up the on-screen row for a track in the currently-playing album,
// but only if that album is actually what's displayed right now — if the
// user has browsed to a different album's page, there's no matching row
// to highlight, so this returns null instead of grabbing some unrelated
// row from whatever tracklist happens to be on screen.
function currentPlayingRowEl(idx){
  if (displayedAlbumSongs !== currentAlbumSongs) return null;
  return el('content').querySelectorAll('tbody tr')[idx] || null;
}

// Same idea as currentPlayingRowEl() above, but for an arbitrary songs
// list rather than specifically the one that's playing — used by the
// "add to queue" feature, since the queued track can belong to a
// different album than whatever's currently loaded in the player.
function rowElForSongs(songs, idx){
  if (displayedAlbumSongs !== songs) return null;
  return el('content').querySelectorAll('tbody tr')[idx] || null;
}

// The "Add to Queue" row-menu item. A real queue now — picking a track
// appends it after whatever's already queued instead of bumping it, so
// any number of tracks (from any albums) can be lined up. Picking a
// track that's already sitting in the queue removes just that one entry
// (an easy undo without needing a separate "remove" control). Queuing
// the track that's already playing right now would do nothing useful,
// so that's called out too.
function queueSongNext(artistName, album, idx){
  const song = album.songs[idx];
  if (!song || !song.playLink) return;

  if (currentAlbumSongs === album.songs && currentSongIndex === idx) {
    showToast("That's already playing.");
    return;
  }

  const existingPos = songQueue.findIndex(q => q.songs === album.songs && q.idx === idx);
  if (existingPos !== -1) {
    songQueue.splice(existingPos, 1);
    showToast("No longer queued.");
    return;
  }

  songQueue.push({ song, idx, songs: album.songs, artistName, albumCoverUrl: (album.cover || "").trim(), album });
  showToast(songQueue.length > 1 ? `Added to queue — ${songQueue.length} up next.` : "Added to queue.");
}

// Called right before the first queued track takes over playback, so
// there's something to come back to once the whole queue has drained.
// A no-op if we're already mid-queue (resumeContext already set) — only
// the album/index from *before* queue playback began should ever be
// saved here.
function saveResumeContextIfNeeded(){
  if (resumeContext) return;
  resumeContext = {
    songs: currentAlbumSongs,
    idx: currentSongIndex,
    artistName: currentArtistName,
    albumCoverUrl: currentAlbumCover,
    albumName: currentAlbumName,
    albumSection: currentAlbumSection,
  };
}

// Restores currentAlbumSongs/currentSongIndex/etc. back to whatever
// album+track was actually playing before the queue took over, so the
// normal advance-to-next-track logic (shuffle/sequential/wrap) picks up
// from the right place instead of continuing inside the last queued
// track's album. Called once the queue has fully drained.
function restoreResumeContext(){
  const ctx = resumeContext;
  resumeContext = null;
  currentAlbumSongs = ctx.songs;
  currentSongIndex = ctx.idx;
  currentArtistName = ctx.artistName;
  currentAlbumCover = ctx.albumCoverUrl;
  currentAlbumName = ctx.albumName;
  currentAlbumSection = ctx.albumSection;
}

let isShuffle = false;
let isRepeat = false;
el('shuffleBtn').addEventListener('click', () => {
  isShuffle = !isShuffle;
  el('shuffleBtn').classList.toggle('active', isShuffle);
});
el('repeatBtn').addEventListener('click', () => {
  isRepeat = !isRepeat;
  el('repeatBtn').classList.toggle('active', isRepeat);
});

audioEl.addEventListener('ended', () => {
  // The queue (see queueSongNext()) always wins here, even over
  // repeat-one below — queuing tracks up is a deliberate, one-time
  // request, and leaving them stuck behind an indefinite loop would make
  // it look like the button just didn't work.
  if (songQueue.length > 0) {
    saveResumeContextIfNeeded();
    const next = songQueue.shift();
    playSongAt(next.idx, rowElForSongs(next.songs, next.idx), next.songs, next.artistName, next.albumCoverUrl, next.album, false, true);
    return;
  }

  // The queue has just fully drained (this was the last queued track
  // finishing) — hop back to whatever album/track was actually playing
  // before the queue took over, so the logic below advances from there
  // instead of continuing inside the last queued track's album.
  const justResumed = !!resumeContext;
  if (justResumed) restoreResumeContext();

  // Loop button now means "repeat this track" — when it's on, a track
  // that finishes just restarts itself, indefinitely, until it's toggled
  // off. This takes priority over shuffle, same as most players' "repeat
  // one" does. (Skipped when we just restored from the queue above —
  // repeat-one tracks the album's own track, not whichever queued track
  // happened to finish last.)
  if (isRepeat && !justResumed) {
    audioEl.currentTime = 0;
    audioEl.play().catch(() => showToast("Couldn't restart playback — the source link may be broken."));
    return;
  }

  const playable = playableIndices();
  if (playable.length === 0) return;

  if (isShuffle) {
    const choices = playable.filter(i => i !== currentSongIndex);
    const pick = choices.length ? choices[Math.floor(Math.random() * choices.length)] : currentSongIndex;
    playSongAt(pick, currentPlayingRowEl(pick));
    return;
  }

  for (let i = currentSongIndex + 1; i < currentAlbumSongs.length; i++) {
    if (currentAlbumSongs[i].playLink) {
      playSongAt(i, currentPlayingRowEl(i));
      return;
    }
  }
  // Reached the end of the tracklist — loop back around to the start of
  // the album (this always happens now; the loop button is only about
  // repeating a single track, not whether the album wraps).
  playSongAt(playable[0], currentPlayingRowEl(playable[0]));
});
el('prevBtn').addEventListener('click', () => {
  // "Smart" previous: once you're a bit into the current track, pressing
  // previous restarts it from the top instead of jumping tracks. Only
  // within the first second does it actually go to the previous track.
  if (audioEl.src && audioEl.currentTime >= 1) {
    audioEl.currentTime = 0;
    el('seek').value = 0;
    seekLastValue = 0;
    updateRangeFill(el('seek'));
    el('curTime').textContent = formatSeconds(0);
    return;
  }
  stepTrack(-1);
});
el('nextBtn').addEventListener('click', () => stepTrack(1));
function stepTrack(dir){
  if (!currentAlbumSongs || currentSongIndex < 0) return;

  // The queue wins over the normal forward step, shuffle included — but
  // only going forward; stepping backward behaves exactly as if nothing
  // were queued (the queued tracks just keep waiting).
  if (dir === 1 && songQueue.length > 0) {
    saveResumeContextIfNeeded();
    const next = songQueue.shift();
    playSongAt(next.idx, rowElForSongs(next.songs, next.idx), next.songs, next.artistName, next.albumCoverUrl, next.album, false, true);
    return;
  }

  // Skipping forward while sitting on the last (now-consumed) queued
  // track: hop back to whatever album/track was playing before the queue
  // took over, same as when that track finishes on its own, so this skip
  // advances within the original album instead of the queued one.
  if (dir === 1 && resumeContext) restoreResumeContext();

  const playable = playableIndices();
  if (playable.length === 0) return;

  // Shuffle only randomizes the "next" direction — previous stays
  // sequential so stepping backward is still predictable. Manually
  // skipping always moves to an actual different track regardless of the
  // loop button — that toggle only affects what happens when a track
  // finishes on its own.
  if (isShuffle && dir === 1) {
    const choices = playable.filter(i => i !== currentSongIndex);
    const pick = choices.length ? choices[Math.floor(Math.random() * choices.length)] : currentSongIndex;
    playSongAt(pick, currentPlayingRowEl(pick));
    return;
  }

  let i = currentSongIndex + dir;
  while (i >= 0 && i < currentAlbumSongs.length) {
    if (currentAlbumSongs[i].playLink) {
      playSongAt(i, currentPlayingRowEl(i));
      return;
    }
    i += dir;
  }
  // Ran off the start/end of the tracklist — wrap around to the other end.
  const wrap = dir === 1 ? playable[0] : playable[playable.length - 1];
  playSongAt(wrap, currentPlayingRowEl(wrap));
}

function updateRangeFill(inputEl){
  const min = parseFloat(inputEl.min) || 0;
  const max = parseFloat(inputEl.max) || 100;
  const val = parseFloat(inputEl.value) || 0;
  const pct = max > min ? ((val - min) / (max - min)) * 100 : 0;
  inputEl.style.background = `linear-gradient(to right, var(--stamp) ${pct}%, var(--border-light) ${pct}%)`;
}

// Animates a range input's visual fill from one value to another (quick
// ease-out) instead of letting it snap instantly. Used when a click/tap
// lands somewhere on the track: the browser jumps the input's real value
// immediately, but this makes the fill visibly catch up to it instead of
// teleporting there.
const rangeFillAnimations = new WeakMap();
function animateRangeFill(inputEl, fromVal, toVal, duration = 180){
  const running = rangeFillAnimations.get(inputEl);
  if (running) cancelAnimationFrame(running);
  const min = parseFloat(inputEl.min) || 0;
  const max = parseFloat(inputEl.max) || 100;
  const startTime = performance.now();
  function step(now){
    const t = Math.min((now - startTime) / duration, 1);
    const eased = 1 - Math.pow(1 - t, 3);
    const val = fromVal + (toVal - fromVal) * eased;
    const pct = max > min ? ((val - min) / (max - min)) * 100 : 0;
    inputEl.style.background = `linear-gradient(to right, var(--stamp) ${pct}%, var(--border-light) ${pct}%)`;
    if (t < 1) {
      rangeFillAnimations.set(inputEl, requestAnimationFrame(step));
    } else {
      rangeFillAnimations.delete(inputEl);
    }
  }
  rangeFillAnimations.set(inputEl, requestAnimationFrame(step));
}

// Distinguishes a plain click/tap on a slider's track from an actual drag,
// by watching for pointer movement past a small threshold after
// pointerdown. A drag already tracks the pointer 1:1 (no animation
// needed); a plain click/tap gets the catch-up animation above.
function makeDragTracker(inputEl, threshold = 4){
  const state = { active:false, moved:false, startX:null };
  inputEl.addEventListener('pointerdown', (e) => {
    state.active = true;
    state.moved = false;
    state.startX = e.clientX;
  });
  window.addEventListener('pointermove', (e) => {
    if (state.active && state.startX !== null && Math.abs(e.clientX - state.startX) > threshold) {
      state.moved = true;
    }
  }, { passive:true });
  function end(){ state.active = false; state.moved = false; state.startX = null; }
  document.addEventListener('pointerup', end);
  document.addEventListener('pointercancel', end);
  return state;
}

let seeking = false;
let seekLastValue = parseFloat(el('seek').value) || 0;
const seekDrag = makeDragTracker(el('seek'));
el('seek').addEventListener('input', () => {
  seeking = true;
  const newVal = parseFloat(el('seek').value) || 0;
  // Live time readout while dragging/clicking around, instead of only
  // updating once the user lets go.
  if (audioEl.duration) {
    el('curTime').textContent = formatSeconds((newVal / 1000) * audioEl.duration);
  }
  if (seekDrag.active && seekDrag.moved) {
    updateRangeFill(el('seek'));
  } else {
    animateRangeFill(el('seek'), seekLastValue, newVal);
  }
  seekLastValue = newVal;
});
el('seek').addEventListener('change', () => {
  if (audioEl.duration) audioEl.currentTime = (el('seek').value / 1000) * audioEl.duration;
  seeking = false;
});
audioEl.addEventListener('timeupdate', () => {
  if (seeking || !audioEl.duration) return;
  el('seek').value = (audioEl.currentTime / audioEl.duration) * 1000;
  seekLastValue = parseFloat(el('seek').value) || 0;
  if (!rangeFillAnimations.has(el('seek'))) updateRangeFill(el('seek'));
  el('curTime').textContent = formatSeconds(audioEl.currentTime);
});
audioEl.addEventListener('loadedmetadata', () => {
  el('durTime').textContent = formatSeconds(audioEl.duration);
});
const savedVolume = localStorage.getItem('archiveVolume');
const initialVolume = savedVolume !== null ? parseFloat(savedVolume) : 1;
audioEl.volume = initialVolume;
el('volume').value = initialVolume;
updateRangeFill(el('seek'));
updateRangeFill(el('volume'));
let volumeLastValue = initialVolume;
const volumeDrag = makeDragTracker(el('volume'));
el('volume').addEventListener('input', (e) => {
  const v = parseFloat(e.target.value);
  audioEl.volume = v;
  if (audioEl.muted) { audioEl.muted = false; setMuteIcon(false); }
  localStorage.setItem('archiveVolume', v);
  if (volumeDrag.active && volumeDrag.moved) {
    updateRangeFill(el('volume'));
  } else {
    animateRangeFill(el('volume'), volumeLastValue, v);
  }
  volumeLastValue = v;
});

function setMuteIcon(muted){
  el('muteBtn').innerHTML = muted ? ICONS.volumeOff : ICONS.volumeOn;
  el('muteBtn').classList.toggle('active', muted);
}
// Mirrors mute state on the slider itself: drops it to 0 when muted, and
// springs it back to the real level when unmuted. audioEl.volume is left
// untouched by muting, so it's what the slider restores to.
function syncVolumeSliderToMute(){
  const volEl = el('volume');
  const from = parseFloat(volEl.value) || 0;
  const to = audioEl.muted ? 0 : audioEl.volume;
  volEl.value = to;
  animateRangeFill(volEl, from, to);
  volumeLastValue = to;
}
el('muteBtn').addEventListener('click', () => {
  audioEl.muted = !audioEl.muted;
  setMuteIcon(audioEl.muted);
  syncVolumeSliderToMute();
});
setMuteIcon(audioEl.muted);
