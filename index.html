/* ---------------- search bar ---------------- */
const searchInput = el('searchInput');
const searchBarWrap = el('searchBarWrap');
const searchClearBtn = el('searchClearBtn');
const searchResultsEl = el('searchResults');

// Flat { song, album, artistName } index across every artist/album, so a
// song can be found and jumped to no matter which artist tab it lives on.
// Rebuilt in loadAllArtists() (see below) every time DATA is fully loaded
// or reloaded, so the index never lags behind what's actually on the sheet.
let SEARCH_INDEX = [];
let lastSearchMatches = [];

function buildSearchIndex(){
  SEARCH_INDEX = [];
  for (const artistName in DATA) {
    (DATA[artistName] || []).forEach(album => {
      if (album.isDivider) return;
      album.songs.forEach(song => SEARCH_INDEX.push({ song, album, artistName }));
    });
  }
}

function runSearch(query){
  const q = query.trim().toLowerCase();
  if (!q) return [];
  return SEARCH_INDEX
    .filter(({ song, album, artistName }) =>
      song.name.toLowerCase().includes(q) ||
      (song.features && song.features.toLowerCase().includes(q)) ||
      album.name.toLowerCase().includes(q) ||
      artistName.toLowerCase().includes(q))
    .slice(0, 40);
}

function renderSearchResults(query){
  lastSearchMatches = runSearch(query);

  if (!query.trim()) {
    searchResultsEl.classList.remove('open');
    searchResultsEl.innerHTML = "";
    return;
  }

  if (lastSearchMatches.length === 0) {
    searchResultsEl.innerHTML = `<div class="search-result-empty">No songs match "${esc(query.trim())}".</div>`;
    searchResultsEl.classList.add('open');
    return;
  }

  searchResultsEl.innerHTML = lastSearchMatches.map(({ song, album, artistName }, i) => {
    const coverUrl = (album.cover || "").trim();
    const hasCover = /^https?:\/\//i.test(coverUrl);
    const coverHtml = hasCover
      ? `<img class="search-result-cover" src="${esc(coverUrl)}" alt="" onerror="this.style.visibility='hidden'">`
      : `<div class="search-result-cover"></div>`;
    const featuresHtml = song.features ? ` <span>(${esc(song.features)})</span>` : "";
    return `
      <div class="search-result-item${song.playLink ? "" : " no-file"}" data-idx="${i}" title="${song.playLink ? "" : "No source file linked yet"}">
        ${coverHtml}
        <div class="search-result-text">
          <div class="search-result-name">${esc(song.name)}${featuresHtml}</div>
          <div class="search-result-meta">${esc(artistName)} — ${esc(album.name)}</div>
        </div>
        <button class="search-result-goto" data-idx="${i}" type="button" title="Go to album">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 18 15 12 9 6"></polyline></svg>
        </button>
      </div>`;
  }).join("");
  searchResultsEl.classList.add('open');

  searchResultsEl.querySelectorAll('.search-result-item').forEach((itemEl, i) => {
    itemEl.addEventListener('click', () => {
      const { song, album, artistName } = lastSearchMatches[i];
      playSearchResult(song, album, artistName);
    });
  });
  searchResultsEl.querySelectorAll('.search-result-goto').forEach((btnEl, i) => {
    btnEl.addEventListener('click', (e) => {
      e.stopPropagation(); // don't let this also trigger the row's play click
      const { album, artistName } = lastSearchMatches[i];
      goToSearchResultAlbum(album, artistName);
    });
  });
}

function closeSearchResults(){
  searchResultsEl.classList.remove('open');
}

// Plays the song in place, wherever the user currently is — does NOT
// navigate to its album. If that album happens to already be the one on
// screen, its row is highlighted like normal; otherwise there's simply no
// row to highlight since we're staying put.
function playSearchResult(song, album, artistName){
  if (!song.playLink) { showToast("No source file linked for this track yet."); return; }
  const idx = album.songs.indexOf(song);
  const rowEl = (displayedAlbumSongs === album.songs)
    ? (el('content').querySelectorAll('tbody tr')[idx] || null)
    : null;
  playSongAt(idx, rowEl, album.songs, artistName, (album.cover || "").trim(), album);
  closeSearchResults();
  searchInput.blur();
}

// The "go to album" button — navigates to the album's page only, no playback.
function goToSearchResultAlbum(album, artistName){
  selectAlbum(artistName, album);
  closeSearchResults();
  searchInput.blur();
}

searchInput.addEventListener('input', () => {
  searchBarWrap.classList.toggle('has-value', searchInput.value.length > 0);
  renderSearchResults(searchInput.value);
});
searchInput.addEventListener('focus', () => {
  if (searchInput.value.trim()) renderSearchResults(searchInput.value);
});
searchInput.addEventListener('keydown', (e) => {
  if (e.key === 'Escape') { closeSearchResults(); searchInput.blur(); }
  else if (e.key === 'Enter' && lastSearchMatches.length) {
    const { song, album, artistName } = lastSearchMatches[0];
    playSearchResult(song, album, artistName);
  }
});
searchClearBtn.addEventListener('click', () => {
  searchInput.value = '';
  searchBarWrap.classList.remove('has-value');
  closeSearchResults();
  searchInput.focus();
});
document.addEventListener('click', (e) => {
  if (!e.target.closest('.search-bar')) closeSearchResults();
});

/* ---------------- changelog / "what's new" ----------------
   Every song with a parseable "Release & File Date" is a changelog
   entry. There's no separate "date added to the sheet" column, so file
   date stands in for it — same source the tracklist's own NEW tag
   already reads via isRecentDate(). The panel lists the newest-dated
   entries first; a small dot on the button badges however many of
   those are newer than the last time THIS visitor opened the panel
   (tracked in localStorage, not on the sheet, so it's per-browser). */
let changelogEntries = [];

// A brand-new visitor has no stored "last seen" timestamp yet — default
// it to a week ago (the same window as the tracklist's own NEW tag)
// rather than the epoch, so the badge doesn't count the sheet's entire
// back-catalog as "unseen" the very first time the page loads.
function getChangelogLastSeen(){
  try {
    const raw = localStorage.getItem('archiveChangelogSeen');
    const ts = raw !== null ? parseInt(raw, 10) : NaN;
    if (!isNaN(ts)) return ts;
  } catch (err) { /* localStorage unavailable — fall through to the default below */ }
  return Date.now() - 7 * 86400000;
}
function setChangelogLastSeen(ts){
  try { localStorage.setItem('archiveChangelogSeen', String(ts)); } catch (err) { /* ignore */ }
}

function collectChangelogEntries(){
  const entries = [];
  for (const artistName in DATA) {
    (DATA[artistName] || []).forEach(album => {
      if (album.isDivider) return;
      album.songs.forEach(song => {
        // Same rule as countAllEdits(): a cross-listed copy shares its
        // original's file date, so counting both would just duplicate
        // one real addition into two changelog rows.
        if (song.crossListed) return;
        const ts = Date.parse(song.releaseDate);
        if (isNaN(ts)) return;
        entries.push({ song, album, artistName, ts });
      });
    });
  }
  entries.sort((a, b) => b.ts - a.ts);
  return entries;
}

function updateChangelogBadge(){
  changelogEntries = collectChangelogEntries();
  const badgeEl = el('changelogBadge');
  if (!badgeEl) return;
  const lastSeen = getChangelogLastSeen();
  const unseenCount = changelogEntries.filter(e => e.ts > lastSeen).length;
  // Just a dot: shown while there's anything newer than the last time the
  // panel was opened, hidden otherwise. No count.
  badgeEl.style.display = unseenCount > 0 ? 'block' : 'none';
}

// Capped well below the full changelogEntries list — this is a quick
// "what's new" glance, not a second copy of the whole archive.
const CHANGELOG_DISPLAY_LIMIT = 40;

function renderChangelogList(){
  const listEl = el('changelogList');
  const shown = changelogEntries.slice(0, CHANGELOG_DISPLAY_LIMIT);

  if (!shown.length) {
    listEl.innerHTML = `<div class="changelog-empty">Nothing dated yet — entries show up here once rows on the sheet have a "Release &amp; File Date" filled in.</div>`;
    return;
  }

  const lastSeen = getChangelogLastSeen();
  listEl.innerHTML = shown.map(({ song, album, artistName, ts }, i) => {
    const isUnseen = ts > lastSeen;
    const newTagHtml = isRecentDate(song.releaseDate) ? `<span class="changelog-new-tag">New</span>` : "";
    const featuresHtml = song.features ? ` <span class="changelog-features">(${esc(song.features)})</span>` : "";
    return `
      <div class="changelog-item${isUnseen ? " is-unseen" : ""}${song.playLink ? "" : " no-file"}" data-idx="${i}" title="${song.playLink ? "" : "No source file linked yet"}">
        <div class="changelog-item-text">
          <div class="changelog-item-name">${esc(song.name)}${featuresHtml}${newTagHtml}</div>
          <div class="changelog-item-meta">${esc(artistName)} — ${esc(album.name)} · ${esc(song.releaseDate)}</div>
        </div>
        <button class="changelog-item-goto" data-idx="${i}" type="button" title="Go to album">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 18 15 12 9 6"></polyline></svg>
        </button>
      </div>`;
  }).join("");

  listEl.querySelectorAll('.changelog-item').forEach((itemEl, i) => {
    itemEl.addEventListener('click', () => {
      const { song, album, artistName } = shown[i];
      playSearchResult(song, album, artistName);
      closeChangelogPanel();
    });
  });
  listEl.querySelectorAll('.changelog-item-goto').forEach((btnEl, i) => {
    btnEl.addEventListener('click', (e) => {
      e.stopPropagation(); // don't also trigger the row's own play click
      const { album, artistName } = shown[i];
      goToSearchResultAlbum(album, artistName);
      closeChangelogPanel();
    });
  });
}

function openChangelogPanel(){
  // Render first (this reads the OLD "last seen" value so tonight's
  // additions still show up highlighted), then stamp "seen" for next
  // time and clear the badge.
  renderChangelogList();
  el('changelogPanel').classList.add('open');
  el('changelogBtn').classList.add('active');
  setChangelogLastSeen(Date.now());
  updateChangelogBadge();
}
function closeChangelogPanel(){
  const panel = el('changelogPanel');
  if (!panel) return;
  panel.classList.remove('open');
  el('changelogBtn').classList.remove('active');
}
function toggleChangelogPanel(){
  const panel = el('changelogPanel');
  if (panel.classList.contains('open')) closeChangelogPanel();
  else openChangelogPanel();
}

el('changelogBtn').addEventListener('click', (e) => {
  e.stopPropagation();
  toggleChangelogPanel();
});
el('changelogCloseBtn').addEventListener('click', () => closeChangelogPanel());
document.addEventListener('click', (e) => {
  if (!e.target.closest('.changelog-panel') && !e.target.closest('.changelog-btn')) closeChangelogPanel();
});

/* ---------------- boot ---------------- */

// Runs once every artist tab is sitting in DATA. Split out from
// buildAlbumsFromRows() because "Original Era" can now point at an
// album on a DIFFERENT artist's tab (see parseOriginalEra() above) -
// that only works once every tab has been fetched and parsed, so this
// can't happen per-tab as songs are read.
// IMPORTANT: only call this once per fresh loadAllArtists() pass (it
// already is, below) - every artist's DATA entry must come straight
// from a fresh buildAlbumsFromRows() call with no cross-listed copies
// in it yet. Calling this a second time on DATA it has already
// processed will duplicate cross-listed songs.
function crossListAndFinalize(){
  // Look up every non-divider album across every artist tab, keyed by
  // "artist name||album name" (case-insensitive) so an Original Era
  // can target an album that lives on someone else's tab.
  const byArtistAndName = new Map();
  for (const artistName in DATA) {
    (DATA[artistName] || []).forEach(album => {
      if (album.isDivider) return;
      byArtistAndName.set(`${artistName.trim().toLowerCase()}||${album.name.trim().toLowerCase()}`, album);
    });
  }

  // Cross-list: a song with an "Original Era" value also gets added to
  // its target album's list (alongside wherever it already lives),
  // with no track number in that second listing. A cross-listed copy's
  // Original Era always resolves back to the very album it now sits
  // in, so the "target === album" check below stops it from being
  // cross-listed a second time when this runs again.
  for (const artistName in DATA) {
    (DATA[artistName] || []).forEach(album => {
      if (album.isDivider) return;
      album.songs.slice().forEach(song => {
        if (!song.originalEra) return;
        const key = `${(song.originalEraArtist || artistName).trim().toLowerCase()}||${song.originalEraName.toLowerCase()}`;
        const target = byArtistAndName.get(key);
        if (!target) {
          console.warn(`"Original Era" on "${song.name}" (${artistName}) says "${song.originalEra}", but no album named "${song.originalEraName}" was found on ${song.originalEraArtist ? `"${song.originalEraArtist}"'s tab (check the artist name matches a CONFIG entry exactly)` : "the same tab"}.`);
          return;
        }
        if (target === album) return;
        target.songs.push({ ...song, trackNum: null, crossListed: true, fromAlbum: album.name, fromArtist: artistName, fromSection: album.section });
      });
    });
  }

  // Finalize song order per album: sheet-numbered tracks keep their
  // given order/number, and anything with no "#" (including tracks
  // that just joined via Original Era) gets sorted alphabetically and
  // appended after them with continuing numbers.
  for (const artistName in DATA) {
    (DATA[artistName] || []).forEach(album => {
      if (album.isDivider) return;
      const numbered = album.songs.filter(s => s.trackNum !== null).sort((x,y) => x.trackNum - y.trackNum);
      const unnumbered = album.songs.filter(s => s.trackNum === null)
        .sort((x,y) => x.name.localeCompare(y.name, undefined, { sensitivity: 'base' }));
      let nextNum = numbered.reduce((max,s) => Math.max(max, s.trackNum), 0) + 1;
      unnumbered.forEach(s => { s.trackNum = nextNum++; });
      album.songs = [...numbered, ...unnumbered];
    });
  }
}

async function loadAllArtists(){
  // Fetch every artist tab at once instead of one-by-one. The old
  // for-loop awaited each tab before starting the next, so total load
  // time was roughly (number of tabs) x (one tab's fetch time) - add a
  // tab, add another full fetch's worth of wait. Promise.all fires all
  // the requests together, so the wait is bounded by the SLOWEST single
  // tab rather than the SUM of all of them, and stays flat as more
  // artist tabs get added later.
  const loaded = await Promise.all(
    CONFIG.artists.map(async artist => [artist.name, await loadArtist(artist)])
  );
  for (const [name, albums] of loaded) {
    DATA[name] = albums;
  }
  crossListAndFinalize();
  buildSearchIndex();
}

// Used only by the cache-first boot path (see boot() below): the page
// has already painted from last time's cached rows, so this quietly
// re-fetches every tab in the background to check whether the live
// sheet actually differs from what's on screen. If nothing changed, it
// does nothing. If something did change, it rebuilds DATA from the
// fresh rows and applies it via refreshInPlace() (not renderAll() -
// see that function for why) so the user's current view updates
// automatically without getting yanked back to the first album, along
// with a toast letting them know a refresh just happened.
async function silentlyRefreshCache(previousRowsByArtist){
  const rowsByArtist = { ...previousRowsByArtist };
  let anyChanged = false;
  await Promise.all(CONFIG.artists.map(async artist => {
    try {
      const rows = await fetchSheetData(CONFIG.spreadsheetId, artist.sheetTab);
      const prevRows = previousRowsByArtist[artist.name];
      if (!prevRows || JSON.stringify(prevRows) !== JSON.stringify(rows)) {
        anyChanged = true;
      }
      rowsByArtist[artist.name] = rows;
      cacheSheetRows(artist.name, rows);
    } catch (err) {
      // A single tab failing this background check just means it keeps
      // whatever rows it already had (from the original cache, or an
      // earlier successful pass of this same loop) - not treated as a
      // change, and not worth bothering the user about since the page
      // is already showing a good (if slightly stale) version.
      console.warn(`Background refresh check failed for "${artist.name}":`, err);
    }
  }));
  if (!anyChanged) return;

  try {
    for (const artist of CONFIG.artists) {
      DATA[artist.name] = buildAlbumsFromRows(rowsByArtist[artist.name], artist.name);
    }
    crossListAndFinalize();
    buildSearchIndex();
    showToast("Updates detected — refreshing…");
    refreshInPlace();
  } catch (err) {
    console.warn("Failed to apply refreshed sheet data:", err);
  }
}

async function reloadData(){
  const btn = el('reloadBtn');
  btn.disabled = true;
  btn.classList.add('spinning');
  const originalLabel = btn.textContent;
  btn.textContent = '⟳ Reloading…';
  try {
    await loadAllArtists();
    renderAll();
    showToast("Reloaded from the spreadsheet.");
  } catch (err) {
    showToast("Couldn't reload — check your connection and try again.");
  } finally {
    btn.disabled = false;
    btn.classList.remove('spinning');
    btn.textContent = originalLabel;
  }
}
el('reloadBtn').addEventListener('click', reloadData);

// The links dropdown is hidden until its row is hovered/focused (see the
// .link-menu-wrap CSS), except while the dropdown itself is open - since
// the menu is position:fixed, the mouse leaves the row's hover area the
// moment it travels toward the menu, so the trigger button gets a
// .force-visible class for as long as its menu stays open, and every
// close path below clears it again.
function closeAllRowMenus(){
  document.querySelectorAll('.info-menu.open, .link-menu.open').forEach(m => m.classList.remove('open'));
  document.querySelectorAll('.link-menu-wrap.force-visible').forEach(w => w.classList.remove('force-visible'));
}

document.addEventListener('click', (e) => {
  const infoBtn = e.target.closest('.info-menu-btn');
  const linkBtn = e.target.closest('.link-menu-btn');
  if (infoBtn || linkBtn) {
    const btn = infoBtn || linkBtn;
    const menu = btn.nextElementSibling;
    const wasOpen = menu && menu.classList.contains('open');
    closeAllRowMenus();
    if (menu && !wasOpen) {
      if (infoBtn) positionInfoMenu(btn, menu);
      else positionLinkMenu(btn, menu);
      menu.classList.add('open');
      const wrap = btn.closest('.link-menu-wrap');
      if (wrap) wrap.classList.add('force-visible');
    }
    return;
  }
  // Picking an item closes the dropdown; the anchor's own href still
  // opens as normal (new tab), so this doesn't need to preventDefault.
  if (e.target.closest('.link-menu-item')) {
    closeAllRowMenus();
    return;
  }
  if (!e.target.closest('.info-menu') && !e.target.closest('.link-menu')) {
    closeAllRowMenus();
  }
});

function positionInfoMenu(btn, menu){
  const margin = 10;
  const btnRect = btn.getBoundingClientRect();

  // Pick whichever side of the button has more room, then size the menu
  // to fill exactly that much space (capped for readability) instead of
  // assuming a fixed width - that way it never has to overlap the
  // button to fit.
  const spaceRight = window.innerWidth - btnRect.right - margin * 2;
  const spaceLeft = btnRect.left - margin * 2;
  const useRight = spaceRight >= spaceLeft;
  const width = Math.max(160, Math.min(520, useRight ? spaceRight : spaceLeft));
  menu.style.width = `${width}px`;

  // Measure the resulting height at that width (briefly shown off-screen).
  menu.style.left = '-9999px';
  menu.style.top = '-9999px';
  menu.classList.add('open');
  const menuRect = menu.getBoundingClientRect();
  menu.classList.remove('open');

  const left = useRight ? (btnRect.right + margin) : (btnRect.left - margin - menuRect.width);

  // Vertically center on the button, then clamp to the viewport.
  let top = btnRect.top + (btnRect.height / 2) - (menuRect.height / 2);
  top = Math.max(margin, Math.min(top, window.innerHeight - menuRect.height - margin));

  menu.style.left = `${left}px`;
  menu.style.top = `${top}px`;
}

// Compact dropdown for a song row's links (Watch on YouTube / Discord
// Message / Download). Unlike the description panel above, this menu
// has a fixed width - it doesn't need to fill available space - so it
// just opens below its trigger, right-aligned to it, and flips above
// the button if there isn't enough room underneath.
function positionLinkMenu(btn, menu){
  const margin = 8;
  const gap = 6;
  const btnRect = btn.getBoundingClientRect();

  menu.style.left = '-9999px';
  menu.style.top = '-9999px';
  menu.classList.add('open');
  const menuRect = menu.getBoundingClientRect();
  menu.classList.remove('open');

  let left = btnRect.right - menuRect.width;
  left = Math.max(margin, Math.min(left, window.innerWidth - menuRect.width - margin));

  let top = btnRect.bottom + gap;
  if (top + menuRect.height + margin > window.innerHeight) {
    top = btnRect.top - menuRect.height - gap;
  }
  top = Math.max(margin, top);

  menu.style.left = `${left}px`;
  menu.style.top = `${top}px`;
}

// If every current artist tab has a cached copy of its rows from a
// previous successful load, paint straight from that - no skeleton, no
// waiting on Google. A cache miss (first-ever visit, a newly-added
// artist tab with nothing cached yet, or a malformed/corrupted cache)
// just falls back to the original skeleton-then-fetch flow further
// down, so there's no scenario where the page fails to load.
(async function boot(){
  const cached = getSheetRowsCache();
  const haveFullCache = CONFIG.artists.length > 0 &&
    CONFIG.artists.every(artist => Array.isArray(cached[artist.name]));

  let paintedFromCache = false;
  if (haveFullCache) {
    try {
      for (const artist of CONFIG.artists) {
        DATA[artist.name] = buildAlbumsFromRows(cached[artist.name], artist.name);
      }
      crossListAndFinalize();
      buildSearchIndex();
      renderAll();
      paintedFromCache = true;
    } catch (err) {
      console.warn("Cached sheet data failed to render, falling back to a live fetch:", err);
    }
  }

  if (paintedFromCache) {
    // Page is already showing last time's data - quietly confirm in the
    // background whether the live sheet has actually moved on since,
    // without disturbing whatever the user does in the meantime.
    silentlyRefreshCache(cached);
  } else {
    fillSidebarSkeleton();
    fillTableSkeleton();
    await loadAllArtists();
    renderAll();
  }
})();

</script>

</body>
</html>
