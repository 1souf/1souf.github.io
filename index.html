<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>❤︎</title>
<link rel="icon" href="img/icon.ico">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
  :root{
    --player-h:84px;     /* height of the fixed player bar */
    --player-gap:20px;   /* breathing room left between the page's last content and the player bar */
    --bg:#111111;
    --bg-rgb:17,17,17;
    --bg-elevated:#1b1b1b;
    --sidebar:#0c0c0c;
    --sidebar-rgb:12,12,12;
    --paper:#f2f2f2;
    --text:#f2f2f2;
    --text-dim:#969696;
    --stamp:#ffffff;
    --stamp-dim:#555555;
    --hazard:#e0e0e0;
    --border:#2a2a2a;
    --border-light:#3d3d3d;
    --mono:-apple-system, BlinkMacSystemFont, 'Inter', 'Helvetica Neue', Arial, sans-serif;
    --display:-apple-system, BlinkMacSystemFont, 'Inter', 'Helvetica Neue', Arial, sans-serif;
  }
  *{box-sizing:border-box;}
  html,body{height:100%;}
  body{
    margin:0; background:var(--bg); color:var(--text);
    font-family:var(--mono); font-weight:600; -webkit-font-smoothing:antialiased;
  }
  html{scrollbar-color:var(--border-light) transparent;}
  a{color:inherit;}
  ::selection{background:var(--stamp); color:#111111;}
  ::-webkit-scrollbar{width:10px; height:10px;}
  ::-webkit-scrollbar-track{background:transparent;}
  ::-webkit-scrollbar-thumb{background:var(--border-light); border:2px solid var(--bg);}
  :focus-visible{outline:2px solid var(--stamp); outline-offset:2px;}

  .app{display:flex; height:100vh; overflow:hidden;}

  /* ---------- sidebar / archive index ---------- */
  .sidebar{
    width:280px; flex-shrink:0; background:var(--sidebar);
    border-right:1px solid var(--border); display:flex; flex-direction:column;
    transition:left .2s ease; z-index:40;
  }
  .sidebar-header{padding:22px 18px 16px; border-bottom:1px solid var(--border);}
  .header-top-row{display:flex; align-items:center; justify-content:space-between; gap:14px;}
  .edit-counter{display:flex; align-items:baseline; gap:9px;}
  .edit-counter-num{
    font-family:var(--display); font-weight:800; font-size:1.7rem; color:var(--stamp);
    letter-spacing:.01em; line-height:1; font-variant-numeric:tabular-nums;
  }
  .edit-counter-label{font-size:.62rem; color:var(--text-dim); letter-spacing:.1em; text-transform:uppercase;}
  .social-links{display:flex; align-items:center; gap:14px; margin-left:auto;}
  .social-link svg{width:18px; height:18px;}
  .header-icon-divider{width:1px; height:16px; background:var(--border); flex-shrink:0;}
  .reload-btn{
    margin-top:12px; width:100%; padding:7px 10px;
    background:var(--bg-elevated); color:var(--text-dim); border:1px solid var(--border-light);
    border-radius:3px; font-family:var(--mono); font-size:.68rem; letter-spacing:.03em;
    cursor:pointer; transition:color .15s ease, border-color .15s ease;
  }
  .reload-btn:hover{color:var(--text); border-color:var(--stamp);}
  .reload-btn:disabled{opacity:.5; cursor:default;}
  .reload-btn.spinning{color:var(--stamp);}

  /* .tree is the clipping viewport; .tree-panes is a 200%-wide strip holding
     the two panes side by side, and sliding it -50% swaps which one shows -
     so only ever one artist's albums exist in the DOM at a time, no matter
     how many artists/albums get added to the sheet. */
  .tree{flex:1; overflow:hidden; position:relative; font-size:.82rem;}
  .tree-panes{display:flex; width:200%; height:100%; transition:transform .28s cubic-bezier(.25,.85,.35,1);}
  .tree-panes.at-albums{transform:translateX(-50%);}
  .tree-pane{width:50%; height:100%; overflow-y:auto; flex-shrink:0;}
  .tree-pane-artists{padding:8px 0;}

  .artist-list-item{
    display:flex; align-items:center; gap:10px; padding:11px 18px;
    cursor:pointer; user-select:none; color:var(--text);
    border-left:2px solid transparent;
  }
  .artist-list-item:hover{background:var(--bg-elevated);}
  .artist-list-item.active{background:var(--bg-elevated); border-left-color:var(--stamp);}
  .artist-list-item .al-avatar{
    width:28px; height:28px; border-radius:50%; flex-shrink:0;
    display:flex; align-items:center; justify-content:center;
    font-size:.68rem; font-weight:700; color:rgba(255,255,255,.85);
    background-size:cover; background-position:center; background-repeat:no-repeat;
    text-transform:uppercase; user-select:none;
  }
  .artist-list-item .al-name{overflow:hidden; text-overflow:ellipsis; white-space:nowrap; min-width:0; flex:1; font-weight:500;}
  .artist-list-item .al-meta{font-size:.68rem; color:var(--text-dim); flex-shrink:0;}
  .artist-list-item .al-chevron{color:var(--text-dim); font-size:.8rem; flex-shrink:0; transition:transform .15s ease, color .15s ease;}
  .artist-list-item:hover .al-chevron{color:var(--stamp); transform:translateX(2px);}

  .pane-albums-header{
    display:flex; align-items:center; gap:10px; padding:13px 16px;
    border-bottom:1px solid var(--border);
    position:sticky; top:0; z-index:2; background:var(--sidebar);
  }
  .pane-back-btn{
    display:flex; align-items:center; gap:4px; background:none; border:none; color:var(--text-dim);
    font-family:var(--mono); font-size:.72rem; letter-spacing:.02em; cursor:pointer; padding:4px 2px;
    flex-shrink:0; transition:color .15s ease, transform .15s ease;
  }
  .pane-back-btn:hover{color:var(--stamp); transform:translateX(-2px);}
  .pane-back-btn svg{width:13px; height:13px; display:block; flex-shrink:0;}
  .pane-artist-name{
    font-size:.78rem; font-weight:700; color:var(--text); text-align:right;
    overflow:hidden; text-overflow:ellipsis; white-space:nowrap; min-width:0; flex:1;
  }
  .pane-albums-list{padding:8px 0;}

  .chevron{display:inline-block; width:9px; color:var(--text-dim); transition:transform .15s ease; font-size:.7rem;}
  .tree-albums{overflow:hidden;}
  .tree-albums.collapsed{display:none;}
  .tree-album-item{
    display:flex; justify-content:space-between; align-items:baseline; gap:8px;
    padding:8px 18px 8px 30px; color:var(--text-dim); cursor:pointer;
    border-left:2px solid transparent;
  }
  .tree-album-item:hover{color:var(--text); background:var(--bg-elevated);}
  .tree-album-item.active{color:var(--text); border-left-color:var(--stamp); background:var(--bg-elevated);}
  .tree-album-item .a-name{overflow:hidden; text-overflow:ellipsis; white-space:nowrap; min-width:0; flex:1;}
  .tree-album-item .a-count{font-size:.68rem; opacity:.55; flex-shrink:0;}
  .tree-divider{
    display:flex; align-items:center; gap:8px;
    padding:6px 16px; margin:2px 0;
    user-select:none; cursor:pointer;
  }
  .tree-divider:hover{background:var(--bg-elevated);}
  .tree-divider .chevron{flex-shrink:0;}
  .tree-divider.collapsed .chevron{transform:rotate(-90deg);}
  .tree-divider .rule{flex:1; height:1px; background:var(--border-light); opacity:.6;}
  .tree-divider .label{
    font-size:.62rem; letter-spacing:.12em; text-transform:uppercase;
    color:var(--text-dim); opacity:.7; white-space:nowrap; flex-shrink:0;
  }
  .sidebar-footer{padding:12px 18px; border-top:1px solid var(--border); font-size:.65rem; color:var(--text-dim); line-height:1.5;}

  /* ---------- main / case file ---------- */
  .main{flex:1; overflow-y:auto; position:relative;}
  .menu-btn{
    display:none; width:100%; text-align:left; background:var(--bg); color:var(--text);
    border:none; border-bottom:1px solid var(--border); padding:14px 18px;
    font-family:var(--mono); font-size:.8rem; cursor:pointer; position:sticky; top:0; z-index:15;
  }
  .demo-banner{
    background:var(--hazard); color:#111111; font-size:.74rem; padding:9px 18px;
    display:flex; justify-content:space-between; gap:12px; flex-wrap:wrap; align-items:center;
  }
  .demo-banner b{text-transform:uppercase; letter-spacing:.04em;}

  /* ---------- search bar ---------- */
  .search-bar-wrap{
    position:sticky; top:0; z-index:15;
    display:flex; justify-content:center;
    background:linear-gradient(to bottom, rgba(var(--bg-rgb),1) 0%, rgba(var(--bg-rgb),.8) 65%, rgba(var(--bg-rgb),.72) 100%);
    backdrop-filter:blur(18px); -webkit-backdrop-filter:blur(18px);
    border-bottom:1px solid var(--border);
    padding:14px 18px;
  }
  .search-bar{
    position:relative;
    display:flex; align-items:center; gap:10px; width:100%; max-width:440px;
    background:var(--bg-elevated); border:1px solid var(--border-light); border-radius:5px;
    padding:9px 12px; transition:border-color .15s ease;
  }
  .search-bar:focus-within{border-color:var(--stamp);}
  .search-bar > svg{width:15px; height:15px; color:var(--text-dim); flex-shrink:0;}
  .search-bar:focus-within > svg{color:var(--stamp);}
  .search-input{
    flex:1; min-width:0; background:none; border:none; outline:none;
    color:var(--text); font-family:var(--mono); font-weight:500; font-size:.8rem;
  }
  .search-input::placeholder{color:var(--text-dim);}
  .search-clear{
    display:none; align-items:center; justify-content:center; flex-shrink:0;
    background:none; border:none; color:var(--text-dim); cursor:pointer; padding:2px;
    transition:color .15s ease;
  }
  .search-clear:hover{color:var(--text);}
  .search-clear svg{width:13px; height:13px; display:block;}
  .search-bar.has-value .search-clear{display:inline-flex;}

  .search-results{
    display:none;
    position:absolute; top:calc(100% + 8px); left:0; right:0;
    max-height:35vh; overflow-y:auto; overscroll-behavior:contain;
    background:var(--bg-elevated); border:1px solid var(--border-light); border-radius:6px;
    box-shadow:0 10px 30px rgba(0,0,0,.5);
    z-index:25;
  }
  .search-results.open{display:block;}
  .search-result-item{
    display:flex; align-items:center; gap:10px; padding:9px 12px;
    cursor:pointer; border-bottom:1px solid var(--border);
  }
  .search-result-item:last-child{border-bottom:none;}
  .search-result-item:hover{background:rgba(255,255,255,.05);}
  .search-result-item.no-file{opacity:.55;}
  .search-result-cover{
    width:32px; height:32px; border-radius:4px; flex-shrink:0;
    background:var(--sidebar); object-fit:cover;
  }
  .search-result-text{min-width:0; flex:1;}
  .search-result-name{
    font-size:.8rem; color:var(--text); font-weight:500;
    overflow:hidden; text-overflow:ellipsis; white-space:nowrap;
  }
  .search-result-name span{color:var(--text-dim); font-weight:400;}
  .search-result-meta{
    font-size:.68rem; color:var(--text-dim); margin-top:2px;
    overflow:hidden; text-overflow:ellipsis; white-space:nowrap;
  }
  .search-result-goto{
    display:inline-flex; align-items:center; justify-content:center; flex-shrink:0;
    width:26px; height:26px; border-radius:4px;
    background:none; border:none; color:var(--text-dim); cursor:pointer;
    transition:color .15s ease, background .15s ease;
  }
  .search-result-goto:hover{color:var(--stamp); background:rgba(255,255,255,.07);}
  .search-result-goto svg{width:15px; height:15px; display:block;}
  .search-result-empty{padding:14px 12px; font-size:.78rem; color:var(--text-dim);}


  .case-file{padding:20px 44px calc(var(--player-h) + var(--player-gap));}
  .stamp-row{display:flex; gap:30px; align-items:stretch; margin-bottom:24px; flex-wrap:wrap;}
  .header-col{flex:1 1 240px; min-width:220px; display:flex; flex-direction:column; justify-content:flex-end;}
  .cover-mount{position:relative; width:168px; height:168px; flex-shrink:0; background:var(--bg-elevated); border-radius:8px; overflow:hidden; box-shadow:0 6px 20px rgba(0,0,0,.45);}
  .cover-mount img{width:100%; height:100%; object-fit:cover; display:block;}
  .cover-fallback{
    display:flex; align-items:center; justify-content:center; height:100%; text-align:center;
    font-size:.62rem; color:var(--text-dim); letter-spacing:.06em; padding:14px;
    background:repeating-linear-gradient(45deg, var(--bg-elevated), var(--bg-elevated) 9px, #23232380 9px, #23232380 18px);
  }
  .stamp-title{
    display:inline-block;
    color:var(--stamp); font-family:var(--display); font-weight:700; font-size:1.9rem;
    letter-spacing:.03em; padding:5px 0; line-height:1.15;
  }
  .file-meta{font-size:.74rem; color:var(--text-dim); margin-top:12px; display:flex; gap:18px; flex-wrap:wrap;}
  .file-meta b{color:var(--text); font-weight:500;}
  .file-meta-artist{display:inline-flex; align-items:center; gap:5px;}
  .fm-avatar{
    width:16px; height:16px; border-radius:50%; flex-shrink:0;
    display:flex; align-items:center; justify-content:center;
    font-size:.55rem; font-weight:700; color:rgba(255,255,255,.85);
    background-size:cover; background-position:center; background-repeat:no-repeat;
    text-transform:uppercase; user-select:none;
  }

  .info-menu-wrap{position:relative;}
  .info-menu-btn{
    background:var(--bg-elevated); border:1px solid var(--border-light); color:var(--text-dim);
    width:38px; height:38px; border-radius:3px; cursor:pointer; font-size:1rem; line-height:1;
    display:flex; align-items:center; justify-content:center; flex-shrink:0;
    transition:color .15s ease, border-color .15s ease, transform .15s ease;
  }
  .info-menu-btn:hover{color:var(--text); border-color:var(--stamp); transform:translateY(-1px);}
  .info-menu{
    display:none; position:fixed; z-index:20;
    width:340px; max-width:80vw; max-height:280px; overflow-y:auto;
    background:var(--bg-elevated); border:1px solid var(--border-light);
    padding:14px 18px; font-size:.8rem; line-height:1.65;
    box-shadow:0 8px 22px rgba(0,0,0,.45);
  }
  .info-menu.open{display:block;}
  .info-menu .desc-block{color:var(--stamp); white-space:pre-line;}
  .info-menu .update-block{color:var(--hazard); white-space:pre-line;}
  .info-menu .desc-block + .update-block{margin-top:12px; padding-top:12px; border-top:1px dashed var(--border-light);}

  /* Hidden until the row is hovered/focused (or its own menu is open, via
     the .force-visible class the JS below adds/removes) so the links
     column stays quiet until a song is actually being looked at. */
  .link-menu-wrap{
    position:relative; display:inline-block;
    opacity:0; pointer-events:none; transition:opacity .12s ease;
  }
  tr:hover .link-menu-wrap,
  .link-menu-wrap:focus-within,
  .link-menu-wrap.force-visible{
    opacity:1; pointer-events:auto;
  }
  .link-menu-btn{
    background:none; border:1px solid transparent; color:var(--text-dim);
    width:26px; height:24px; border-radius:3px; cursor:pointer; font-size:1rem; line-height:1;
    display:inline-flex; align-items:center; justify-content:center; flex-shrink:0;
    transition:color .15s ease, border-color .15s ease, background .15s ease;
  }
  .link-menu-btn:hover{color:var(--stamp); border-color:var(--border-light); background:var(--bg-elevated);}
  .link-menu{
    display:none; position:fixed; z-index:20; width:188px;
    background:var(--bg-elevated); border:1px solid var(--border-light); border-radius:4px;
    padding:5px; box-shadow:0 8px 22px rgba(0,0,0,.45);
  }
  .link-menu.open{display:block;}
  .link-menu-item{
    display:flex; align-items:center; gap:10px; padding:8px 9px; border-radius:3px;
    color:var(--text); text-decoration:none; font-size:.78rem; font-weight:500;
    background:none; border:none; width:100%; text-align:left; cursor:pointer; font-family:inherit;
    transition:background .12s ease, color .12s ease;
  }
  .link-menu-item:hover{background:var(--bg); color:var(--stamp);}
  .link-menu-item svg{width:15px; height:15px; flex-shrink:0; display:block; color:var(--text-dim);}
  .link-menu-item:hover svg{color:var(--stamp);}

  .actions{display:flex; align-items:center; gap:10px; margin-top:14px; flex-wrap:wrap;}
  .btn{
    font-family:var(--mono); font-size:.78rem; letter-spacing:.02em; padding:10px 18px;
    border:1px solid var(--border-light); background:var(--bg-elevated); color:var(--text);
    border-radius:3px; cursor:pointer; text-decoration:none; display:inline-flex; align-items:center; gap:8px;
    transition:color .15s ease, border-color .15s ease, transform .15s ease;
  }
  .btn:hover{border-color:var(--stamp); color:var(--stamp); transform:translateY(-1px);}
  .btn.primary{background:var(--stamp); border-color:var(--stamp); color:#111111;}
  .btn.primary:hover{background:var(--stamp-dim); border-color:var(--stamp-dim); color:var(--text);}

  table.manifest{width:100%; border-collapse:collapse; margin-top:0;}
  table.manifest thead th{
    text-align:left; font-size:.66rem; letter-spacing:.08em; color:var(--text-dim);
    font-weight:500; border-bottom:1px solid var(--border); padding:9px 10px; text-transform:uppercase;
  }
  table.manifest tbody tr{border-bottom:1px solid var(--border); cursor:pointer;}
  table.manifest tbody tr:hover{background:var(--bg-elevated);}
  table.manifest tbody tr.playing{background:var(--bg-elevated);}
  table.manifest td{padding:12px 10px; vertical-align:top; font-size:.84rem;}
  .num-cell{width:30px; color:var(--text-dim);}
  .num-cell .n, .num-cell .p{display:inline-block; width:16px; text-align:left;}
  .num-cell .p{display:none;}
  tr:hover .num-cell .n{display:none;}
  tr:hover .num-cell .p{display:inline-block; color:var(--stamp);}
  .title-cell .t-name{color:var(--text); font-weight:500;}
  .title-cell .t-new-tag{
    display:inline-block; vertical-align:middle; margin-left:8px; position:relative; top:-1px;
    padding:2px 6px; border-radius:3px; background:var(--stamp); color:var(--sidebar);
    font-size:.58rem; font-weight:800; letter-spacing:.06em; text-transform:uppercase;
  }
  .title-cell .t-features{color:var(--text-dim); font-size:.76rem; margin-top:2px;}
  .title-cell .t-comp-tag{
    display:inline-flex; align-items:center; gap:5px;
    margin-top:5px; padding:2px 8px 2px 7px;
    border:1px solid var(--border-light); border-radius:20px;
    font-size:.62rem; font-weight:600; letter-spacing:.04em; text-transform:uppercase;
    color:var(--text-dim); max-width:fit-content;
  }
  .title-cell .t-comp-tag::before{content:"◆"; font-size:.5rem; color:var(--stamp-dim);}
  tr:hover .title-cell .t-comp-tag{border-color:var(--stamp-dim); color:var(--text);}
  .credit-cell{color:var(--text-dim); font-size:.76rem; max-width:280px;}
  .release-cell{color:var(--text-dim); font-size:.76rem; white-space:nowrap;}
  .notes-cell{color:var(--text-dim); font-size:.76rem; max-width:400px; line-height:1.5;}
  .time-cell{text-align:right; color:var(--text-dim); white-space:nowrap; width:54px;}
  .t-loading{opacity:.45;}
  .discord-cell{width:44px; text-align:right; white-space:nowrap;}
  .th-icon{width:13px; height:13px; display:inline-block; vertical-align:middle;}
  .link-icons{display:inline-flex; align-items:center; gap:12px; justify-content:flex-end;}
  .link-icon{
    display:inline-flex; align-items:center; justify-content:center;
    color:var(--text-dim); text-decoration:none;
    transition:color .15s ease, transform .15s ease;
  }
  .link-icon:hover{color:var(--stamp); transform:translateY(-1px);}
  .link-icon svg{width:16px; height:16px; display:block;}
  .no-file{color:var(--text-dim); opacity:.5;}

  .eq{display:inline-flex; align-items:flex-end; gap:2px; height:12px;}
  .eq span{width:2px; background:var(--stamp); animation:eq .9s ease-in-out infinite; display:inline-block;}
  .eq span:nth-child(2){animation-delay:.2s;}
  .eq span:nth-child(3){animation-delay:.4s;}
  @keyframes eq{0%,100%{height:3px;} 50%{height:11px;}}
  @media (prefers-reduced-motion: reduce){ .eq span{animation:none; height:7px;} }

  .empty-state{padding:60px 44px; color:var(--text-dim); font-size:.86rem; max-width:50ch;}
  .empty-state b{color:var(--text); display:block; font-family:var(--display); font-size:1.1rem; margin-bottom:10px; text-transform:uppercase;}

  /* ---------- "more from this artist" row ---------- */
  .more-albums{margin:30px 0 0;}
  .more-albums-title{
    font-size:.68rem; letter-spacing:.09em; text-transform:uppercase;
    color:var(--text-dim); margin-bottom:14px;
  }
  .more-albums-row{
    display:flex; gap:16px; overflow-x:auto; padding:6px 0 8px;
    margin-top:-6px;   /* cancels the top padding so cards don't move; that room stops the enlarged cover being clipped at the top */
    scrollbar-width:thin;
  }
  .more-album-card{flex-shrink:0; width:128px; cursor:pointer;}
  .more-album-cover{
    width:128px; height:128px; border-radius:6px; overflow:hidden;
    background:var(--bg-elevated); box-shadow:0 4px 14px rgba(0,0,0,.4);
    transition:transform .15s ease, box-shadow .15s ease;
  }
  .more-album-card:hover .more-album-cover{transform:scale(1.05); box-shadow:0 8px 22px rgba(0,0,0,.5);}
  /* The row's left/right edges line up with the track table and clip anything past them, so the
     first and last covers grow inward from their outer edge instead of poking out and getting cut. */
  .more-album-card:first-child .more-album-cover{transform-origin:left center;}
  .more-album-card:last-child:not(:first-child) .more-album-cover{transform-origin:right center;}
  .more-album-cover img{width:100%; height:100%; object-fit:cover; display:block;}
  .more-album-cover-fallback{
    width:100%; height:100%; display:flex; align-items:center; justify-content:center;
    font-size:.6rem; letter-spacing:.05em; color:var(--text-dim); text-align:center; padding:8px;
  }
  .more-album-name{
    margin-top:9px; font-size:.78rem; font-weight:600; color:var(--text); line-height:1.3;
    overflow:hidden; text-overflow:ellipsis; display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical;
  }
  .more-album-card:hover .more-album-name{color:var(--stamp);}
  .more-album-count{margin-top:2px; font-size:.68rem; color:var(--text-dim);}

  /* ---------- skeleton loading ---------- */
  @keyframes skel-shimmer{
    0%{background-position:-360px 0;}
    100%{background-position:360px 0;}
  }
  .skel{
    display:inline-block; border-radius:3px; vertical-align:middle; color:transparent;
    background-color:var(--bg-elevated);
    background-image:linear-gradient(90deg, var(--bg-elevated) 0px, #2d2d2d 40px, var(--bg-elevated) 80px);
    background-size:720px 100%;
    animation:skel-shimmer 1.6s linear infinite;
  }
  @media (prefers-reduced-motion: reduce){ .skel{animation:none;} }
  .cover-mount.skel{display:block;}
  .skel-title{display:block; width:250px; height:30px; margin:5px 0 3px;}
  tr.skel-row{cursor:default;}
  tr.skel-row:hover{background:none;}

  /* ---------- player ---------- */
  .player{
    position:fixed; left:280px; right:0; bottom:0; height:var(--player-h);
    background:linear-gradient(to top, rgba(var(--sidebar-rgb),1) 0%, rgba(var(--sidebar-rgb),.8) 65%, rgba(var(--sidebar-rgb),.72) 100%);
    backdrop-filter:blur(18px); -webkit-backdrop-filter:blur(18px);
    border-top:1px solid var(--border);
    display:flex; align-items:center; padding:0 20px; gap:22px; z-index:20;
    transition:left .2s ease;
    /* .player-left and .player-extra both read this, so the flexible
       center column between them always lands on the true center of
       the bar instead of drifting toward whichever side is narrower. */
    --player-side-w:280px;
  }
  .player-left{display:flex; align-items:center; gap:16px; width:var(--player-side-w); flex-shrink:0; overflow:hidden;}
  .player-track{display:flex; align-items:center; gap:12px; min-width:0; overflow:hidden;}
  .player-cover{width:56px; height:56px; background:var(--bg-elevated); flex-shrink:0; object-fit:cover; border-radius:6px;}
  .player-text{overflow:hidden; min-width:0;}
  .marquee-mask{overflow:hidden; white-space:nowrap; position:relative; display:block;}
  /* width:max-content keeps the clickable/hoverable area to the text itself
     instead of the whole (wider) column - the marquee measures overflow on the
     mask, so this doesn't change how it scrolls. Clicking it jumps to the
     album the track is playing from (see the playerTitle click handler). */
  .player-title{font-size:.92rem; font-weight:600; color:var(--text); white-space:nowrap; display:block; width:max-content; cursor:pointer;}
  .player-title:hover{text-decoration:underline;}
  .player-sub{font-size:.78rem; color:var(--text-dim); white-space:nowrap; display:block;}
  .player-links{display:flex; align-items:center; gap:11px; flex-shrink:0;}
  .player-links .link-icon svg{width:15px; height:15px;}

  /* .player-center stretches to the bar's full height; space-evenly then
     splits the leftover space (bar height minus the two rows' own height)
     into three equal gaps — above .ctrl-row, between the two rows, and
     below .progress-row — so each row is centered in the space around it
     rather than one row sitting flush against an edge. */
  .player-center{display:flex; flex-direction:column; align-items:center; justify-content:space-evenly; align-self:stretch; flex:1; min-width:0;}
  .ctrl-row{display:flex; align-items:center; gap:18px; flex-shrink:0;}
  .ctrl-row-core{display:flex; align-items:center; gap:6px;}
  .ctrl-btn{
    background:none; border:none; color:var(--text-dim); cursor:pointer; padding:4px;
    display:inline-flex; align-items:center; justify-content:center; position:relative;
    transition:color .15s ease, transform .15s ease;
  }
  .ctrl-btn svg{width:15px; height:15px; display:block;}
  #shuffleBtn svg{width:16px; height:16px;}
  .ctrl-btn:hover{color:var(--text);}
  .ctrl-btn.active{color:var(--stamp);}
  .ctrl-btn.active::after{
    content:""; position:absolute; left:50%; bottom:-3px; transform:translateX(-50%);
    width:3px; height:3px; border-radius:50%; background:var(--stamp);
  }
  .ctrl-btn.skip{color:var(--text-dim); padding:6px;}
  .ctrl-btn.skip:hover{color:var(--text);}
  .ctrl-btn.skip svg{width:21px; height:21px;}
  #muteBtn.active::after{content:none;}
  #muteBtn.active{color:var(--text-dim);}
  #muteBtn.active:hover{color:var(--text);}
  .ctrl-btn.play{color:var(--stamp); padding:0; width:46px; height:46px;}
  .ctrl-btn.play svg{width:36px; height:36px;}
  .ctrl-btn.play:hover{color:var(--stamp); transform:scale(1.06);}
  .ctrl-btn.play:active{transform:scale(0.94);}
  .progress-row{display:flex; align-items:center; gap:8px; width:100%; max-width:460px; font-size:.68rem; color:var(--text-dim); -webkit-user-select:none; -moz-user-select:none; -ms-user-select:none; user-select:none;}
  #curTime, #durTime{font-variant-numeric:tabular-nums; flex-shrink:0;}
  input[type=range]{-webkit-appearance:none; appearance:none; height:6px; background:var(--border-light); flex:1; border-radius:3px; cursor:pointer;}
  input[type=range]::-webkit-slider-thumb{-webkit-appearance:none; width:6px; height:6px; background:transparent; border-radius:50%; cursor:pointer;}
  input[type=range]::-moz-range-thumb{width:6px; height:6px; background:transparent; border:none; border-radius:50%; cursor:pointer;}
  .player-extra{display:flex; align-items:center; gap:10px; width:var(--player-side-w); justify-content:flex-end; flex-shrink:0;}
  #muteBtn svg{width:17px; height:17px;}
  /* flex:none overrides the input[type=range] flex:1 above — without it
     the volume slider grows to fill .player-extra's whole width instead
     of staying a fixed width. */
  #volume{width:96px; flex:none;}
  .toast{
    position:fixed; bottom:96px; left:50%; transform:translateX(-50%);
    background:var(--paper); color:#111111; font-size:.78rem; padding:10px 18px;
    border:1px solid var(--border-light); z-index:60; opacity:0; pointer-events:none;
    transition:opacity .2s ease;
  }
  .toast.show{opacity:1;}

  /* ---------- changelog / "what's new" ---------- */
  .changelog-btn{
    position:fixed; top:16px; right:30px; z-index:55;
    display:flex; align-items:center; gap:8px;
    background:var(--bg-elevated); color:var(--text-dim); border:1px solid var(--border-light);
    border-radius:20px; padding:8px 14px 8px 12px; font-family:var(--mono); font-weight:600;
    font-size:.72rem; letter-spacing:.03em; cursor:pointer;
    transition:color .15s ease, border-color .15s ease;
    box-shadow:0 4px 16px rgba(0,0,0,.35);
  }
  .changelog-btn svg{width:15px; height:15px; flex-shrink:0;}
  .changelog-btn:hover, .changelog-btn.active{color:var(--text); border-color:var(--stamp);}
  .changelog-btn-label{white-space:nowrap;}
  .changelog-bell{position:relative; display:flex; flex-shrink:0;}
  /* Just a dot - no count. (It used to hold the number, which needed a wide
     badge hanging off the bell and a bigger gap before the label.) */
  .changelog-badge{
    display:none;
    position:absolute; top:1px; right:1px;   /* on the bell's top-right shoulder, just outside its outline */
    width:4px; height:4px; border-radius:50%;
    background:var(--stamp);
    box-shadow:0 0 0 1px var(--bg-elevated);   /* thin ring that separates the dot from the bell */
  }

  .changelog-panel{
    display:none; flex-direction:column;
    position:fixed; top:60px; right:30px; z-index:55;
    width:360px; max-width:calc(100vw - 36px); max-height:min(70vh, 520px);
    background:var(--bg-elevated); border:1px solid var(--border-light); border-radius:8px;
    box-shadow:0 10px 30px rgba(0,0,0,.5); overflow:hidden;
  }
  .changelog-panel.open{display:flex;}
  .changelog-panel-header{
    display:flex; align-items:center; justify-content:space-between; flex-shrink:0;
    padding:12px 14px; border-bottom:1px solid var(--border);
    font-size:.68rem; letter-spacing:.08em; text-transform:uppercase; color:var(--text-dim);
  }
  .changelog-close{background:none; border:none; color:var(--text-dim); cursor:pointer; padding:2px; display:flex;}
  .changelog-close svg{width:14px; height:14px;}
  .changelog-close:hover{color:var(--text);}
  .changelog-list{flex:1; min-height:0; overflow-y:auto;}
  .changelog-empty{padding:26px 14px; color:var(--text-dim); font-size:.78rem; text-align:center; line-height:1.5;}
  .changelog-item{
    display:flex; align-items:center; gap:10px; padding:10px 14px;
    cursor:pointer; border-bottom:1px solid var(--border); border-left:2px solid transparent;
  }
  .changelog-item:last-child{border-bottom:none;}
  .changelog-item:hover{background:rgba(255,255,255,.05);}
  .changelog-item.is-unseen{border-left-color:var(--stamp);}
  .changelog-item.no-file{opacity:.55;}
  .changelog-item-text{min-width:0; flex:1;}
  .changelog-item-name{
    font-size:.82rem; font-weight:600; color:var(--text);
    overflow:hidden; text-overflow:ellipsis; white-space:nowrap;
  }
  .changelog-features{font-weight:500; color:var(--text-dim);}
  .changelog-new-tag{
    display:inline-block; margin-left:7px; padding:1px 6px; border-radius:3px;
    background:var(--stamp); color:#111111; font-size:.58rem; font-weight:800;
    letter-spacing:.04em; text-transform:uppercase; vertical-align:middle;
  }
  .changelog-item-meta{
    font-size:.7rem; color:var(--text-dim); margin-top:2px;
    overflow:hidden; text-overflow:ellipsis; white-space:nowrap;
  }
  /* Same arrow button as the search results' (.search-result-goto): a 26px
     square that lights up on hover. */
  .changelog-item-goto{
    display:inline-flex; align-items:center; justify-content:center; flex-shrink:0;
    width:26px; height:26px; border-radius:4px;
    background:none; border:none; color:var(--text-dim); cursor:pointer;
    transition:color .15s ease, background .15s ease;
  }
  .changelog-item-goto:hover{color:var(--stamp); background:rgba(255,255,255,.07);}
  .changelog-item-goto svg{width:15px; height:15px; display:block;}

  @media (max-width:820px){
    .sidebar{position:fixed; left:-280px; top:0; bottom:0;}
    .sidebar.open{left:0;}
    .menu-btn{display:block;}
    .player{left:0;}
    .search-bar-wrap{position:static; padding:12px 18px;}
    .search-bar{max-width:none;}
    .case-file{padding:16px 18px calc(var(--player-h) + var(--player-gap));}
    .stamp-row{gap:18px;}
    .cover-mount{width:120px; height:120px;}
    .stamp-title{font-size:1.4rem;}
    .notes-card{max-width:none; width:100%;}
    .more-album-card{width:104px;}
    .more-album-cover{width:104px; height:104px;}
    .credit-cell, .notes-cell, .release-cell{display:none;}
    .player{--player-side-w:150px;}
    .player-links{display:none;}
    #volume{display:none;}
    .changelog-btn{top:6px; right:16px; padding:8px; border-radius:50%;}
    .changelog-btn-label{display:none;}
    .changelog-panel{top:52px; right:16px; left:10px; width:auto; max-width:none;}
  }
</style>
</head>

/* Column layout: see the comment above buildAlbumsFromRows() further

let isDemoMode = false;
// currentAlbumSongs/currentAlbumCover/currentArtistName/currentSongIndex/currentRowEl
// describe whatever is actually loaded in the audio element right now.
// displayedAlbumSongs describes whichever album's tracklist is currently
// on screen. These are kept separate on purpose: browsing to a different
// album's page must never change what's actually playing or how
// prev/next/repeat/shuffle navigate it.
let currentAlbumSongs = null;

let currentSongIndex = -1;

// Built by a song row's "Add to Queue" menu item (see queueSongNext()).
// A real FIFO queue now (not a single slot) — each entry holds everything
// playSongAt() needs (its own songs array, cover, artist, album), since a
// queued track can live on a different album/artist than whatever's
// currently playing. Consumed from the front the moment playback next
// actually advances forward on its own — stepTrack(1) or a track
// finishing — see both below.
let songQueue = [];
// While songQueue is being worked through, this remembers the album/index
// that was actually playing right before the *first* queued track took
// over, so that once the whole queue has drained, playback can resume
// that original album from where it left off instead of getting stuck
// treating the last queued track's album as the new "current" album.
// Set once when queue playback begins, cleared once it's restored.
let resumeContext = null;
// Name + section of the album the loaded track is playing from (the artist is
// currentArtistName). Stored as names rather than the album object so the
// player bar's "go to album" click still finds it after a background refresh
// rebuilds DATA with brand-new album objects.
let currentAlbumName = "";
let currentAlbumSection = "";
let displayedAlbumSongs = null;
// Which artist/album is currently shown in the case file. The sidebar's
// album pane is rebuilt from scratch every time it's opened (see
// openArtistPane()), so this is how it knows which row to mark active
// instead of relying on a DOM element that may no longer exist.
let selectedArtistName = null;
let selectedAlbumName = null;
// A comp and an edit (any two albums under different dividers) can share a name, so the
// section is part of "which album is open" as well - name alone can't tell them apart.
let selectedAlbumSection = null;
const DEFAULT_TITLE = document.title; // page title before any track has played, restored when the player closes

const el = (id) => document.getElementById(id);
const audioEl = el('audioEl');

function esc(s){
  if (s === null || s === undefined) return "";
  return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");
}

function showToast(msg){
  const t = el('toast');
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(showToast._h);
  showToast._h = setTimeout(()=>t.classList.remove('show'), 3200);
}

function sheetCsvUrl(sheetId, tabName){
  return `https://docs.google.com/spreadsheets/d/${sheetId}/gviz/tq?tqx=out:csv&sheet=${encodeURIComponent(tabName)}`;
}

// Counter (rather than just Date.now()) guarantees a unique callback
// name even when several tabs are requested in the same millisecond,
// which happens now that loadAllArtists() fires every tab at once.
let sheetFetchCallbackCounter = 0;
function fetchSheetData(sheetId, tabName){
  return new Promise((resolve, reject) => {
    const callbackName = 'sheetArchiveCallback_' + Date.now() + '_' + (sheetFetchCallbackCounter++);

    const url =
      `https://docs.google.com/spreadsheets/d/${sheetId}/gviz/tq` +
      `?tqx=out:json;responseHandler:${callbackName}` +
      `&headers=1` +
      `&sheet=${encodeURIComponent(tabName)}`;

    const script = document.createElement('script');
    script.src = url;

    const timeout = setTimeout(() => {
      cleanup();
      reject(new Error("Google Sheets request timed out."));
    }, 10000);

    function cleanup(){
      clearTimeout(timeout);
      delete window[callbackName];
      if (script.parentNode) script.remove();
    }

    window[callbackName] = (data) => {
      try {
        if (!data?.table) {
          throw new Error("Google returned no table.");
        }

        const cols = data.table.cols || [];
        const rows = data.table.rows || [];

        console.log("RAW GVIZ TABLE:", data.table);
        console.log("COVER CELL RAW (first album row, column F):", JSON.stringify(rows[0]?.c?.[5], null, 2));
        console.log("FULL FIRST ALBUM ROW, ALL COLUMNS:", JSON.stringify(rows[0]?.c, null, 2));

        // Convert Google's cells while PRESERVING empty cells.
        const result = [];

        // Fake header row so buildAlbumsFromRows() can stay unchanged.
        result.push(cols.map(c => c?.label || ""));

        for (const row of rows) {
          const cells = row.c || [];

          const converted = [];

          for (let i = 0; i < cols.length; i++) {
            const cell = cells[i];

            if (!cell) {
              converted.push("");
            } else if (cell.v !== null && cell.v !== undefined && cell.v !== "") {
              converted.push(String(cell.v));
            } else if (cell.f) {
              // Some cell types (e.g. a pasted link that Sheets turned into
              // a Smart Chip) have no plain "value" for gviz to return, but
              // do carry a formatted display string in "f" - fall back to
              // that so chip-style links still come through.
              converted.push(String(cell.f));
            } else {
              converted.push("");
            }
          }

          result.push(converted);
        }

        console.log("GOOGLE ROWS:", result);
        cleanup();
        resolve(result);

      } catch (err) {
        cleanup();
        reject(err);
      }
    };

    script.onerror = () => {
      cleanup();
      reject(new Error("Could not load Google Sheet."));
    };

    document.body.appendChild(script);
  });
}


/* Columns are now looked up by their header-row label instead of a fixed
   A-I position, since a real sheet's columns can end up reordered or
   have unlabeled columns added later. Row 1 of the tab must contain a
   label for every column the site needs to read, including a
   "Cover & YT Link(s)" column, which holds the header rows' cover art
   link AND each song row's YouTube link - any column with no label in
   row 1 is invisible to Google's data endpoint and will never come
   through, no matter what's typed into it below. Expected labels:
   Era, Name, Notes, Credits, Release Date, Original Era, #, Feature(s),
   Discord Link(s), Link(s), Cover & YT Link(s).
   A header row is detected as: the Era column empty AND the Name
   column non-empty.

   "Release Date" does double duty like Notes/Credits: on a song row
   it's that song's release date (shown in its own table column,
   between Credits and Time); on an album header row it's the album's
   release date (shown in the file-meta line next to Artist/Tracks/
   Runtime). Either one is optional - leave the cell blank and
   nothing renders for it.

   "Original Era" (song rows only) cross-lists a song into another
   album: type that album's exact name in and the song will also show
   up there (in addition to staying where it is), with no track number
   in that second listing. By default the target album is looked up on
   the SAME artist tab the song itself is on. To cross-list into an
   album on a DIFFERENT artist's tab, append that artist's exact
   CONFIG name in curly braces, e.g. "Pink Tape [V2]{Lil Uzi Vert}" -
   see parseOriginalEra() and crossListAndFinalize() near the bottom of
   the data-loading section, which runs once every artist tab has
   loaded (it has to run after everything is loaded, since it may need
   to reach across tabs). Track length is no longer read from the
   sheet at all - see probeDuration(), it's detected from the audio
   file itself.

   "Feature(s)" only means something on a SONG row (the featured
   artists shown under the track name). On an ALBUM HEADER row that
   column does nothing else, so it doubles as a place to drop that
   artist's sidebar profile picture: paste an image link into the
   Feature(s) cell of any of that artist's album headers and the
   sidebar's artist-list avatar picks up the first link it finds
   scanning that artist's headers in sheet order (see extractUrl() and
   artistProfilePic()). Leave every header's Feature(s) cell blank and
   the sidebar just falls back to a plain initial. */

// Parses a song's raw "Original Era" cell into a target album name and
// target artist. Plain text ("Whole Lotta Red [V3]") targets an album
// on the song's OWN artist tab. Text ending in "{Artist Name}"
// ("Pink Tape [V2]{Lil Uzi Vert}") targets that album on a DIFFERENT
// artist's tab instead - the artist name must match a CONFIG.artists
// "name" exactly (case-insensitive, whitespace-trimmed).
function parseOriginalEra(raw, ownArtistName){
  const trimmed = String(raw || "").trim();
  if (!trimmed) return null;
  const m = trimmed.match(/^(.*?)\{\s*([^}]+?)\s*\}\s*$/);
  if (m) return { eraName: m[1].trim(), eraArtist: m[2].trim() };
  return { eraName: trimmed, eraArtist: ownArtistName };
}

function buildAlbumsFromRows(rows, artistName){
  const albums = [];
  let current = null;
  let currentSection = ""; // divider label an album falls under, e.g. "Comps"

  const headerLabels = (rows[0] || []).map(h => String(h || "").trim().toLowerCase());
  const col = (label) => headerLabels.indexOf(label.toLowerCase());

  const idx = {
    name:        col("Name"),
    notes:       col("Notes"),
    credits:     col("Credits"),
    releaseDate: col("Release & File Date"),
    originalEra: col("Original Era"),
    trackNum:    col("#"),
    features:    col("Feature(s)"),
    discord:     col("Discord Link(s)"),
    link:        col("Link(s)"),
    cover:       col("Cover & YT Link(s)")
  };
  console.log("COLUMN LOOKUP (label -> index, -1 means \"not found - check row 1's header text\"):", idx);

  for (let i = 1; i < rows.length; i++) {
    const row = rows[i] || [];

    const a = String(row[0] || "").trim();
    const b = String(row[idx.name] || "").trim();

    // SECTION DIVIDER — a purely visual separator row in the sheet where
    // the same label (e.g. "Comps", "Edits") is typed into every column.
    // Detected as: Era column and Name column hold the exact same text.
    if (a !== "" && a === b) {
      albums.push({ isDivider: true, label: a });
      currentSection = a;
      continue;
    }

    // ALBUM HEADER
    // A = empty
    // Name column = album name
    if (a === "" && b !== "") {
      current = {
        name: b,
        section: currentSection,
        description: String(row[idx.notes] || ""),
        updates: String(row[idx.credits] || ""),
        releaseDate: String(row[idx.releaseDate] || "").trim(),
        cover: String(row[idx.cover] || ""),
        discordLink: String(row[idx.discord] || "").trim(),
        downloadLink: String(row[idx.link] || "").trim(),
        pfpLink: extractUrl(row[idx.features]),
        songs: []
      };

      albums.push(current);
      continue;
    }

    // SONG
    if (a !== "" && b !== "" && current) {
      const rawNum = String(row[idx.trackNum] || "").trim();
      const parsedNum = parseInt(rawNum, 10);
      const originalEraRaw = String(row[idx.originalEra] || "").trim();
      const parsedEra = originalEraRaw ? parseOriginalEra(originalEraRaw, artistName) : null;
      current.songs.push({
        name: b,
        notes: String(row[idx.notes] || ""),
        credits: String(row[idx.credits] || ""),
        releaseDate: String(row[idx.releaseDate] || "").trim(),
        length: "",
        trackNum: (rawNum !== "" && !isNaN(parsedNum)) ? parsedNum : null,
        originalEra: originalEraRaw,
        originalEraName: parsedEra ? parsedEra.eraName : "",
        originalEraArtist: parsedEra ? parsedEra.eraArtist : "",
        ownerArtist: artistName,
        features: String(row[idx.features] || "").trim(),
        discordLink: String(row[idx.discord] || "").trim(),
        playLink: String(row[idx.link] || "").trim(),
        ytLink: String(row[idx.cover] || "").trim()
      });
    }
  }

  // NOTE: cross-listing (via "Original Era") and per-album song-order
  // finalization used to happen right here, but both now happen once
  // in crossListAndFinalize(), after every artist tab has loaded - see
  // that function for why.

  console.log(
    "ALBUMS FOUND:",
    albums.map(a => a.isDivider
      ? { divider: a.label }
      : { name: a.name, songs: a.songs.length, cover: a.cover })
  );

  return albums;
}


async function loadArtist(artist){

      CONFIG.spreadsheetId,
      artist.sheetTab
    );

    console.log("SHEET ROWS:", rows);
    cacheSheetRows(artist.name, rows);

  } catch (err) {
