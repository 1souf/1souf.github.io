<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<!-- No-JS / slow-JS fallback — if the script below never runs, this still
     gets people back to the archive on its own. -->
<meta http-equiv="refresh" content="6;url=index.html">
<title>404 — ❤︎</title>
<link rel="icon" href="img/icon.ico">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#111111;
    --bg-elevated:#1b1b1b;
    --text:#f2f2f2;
    --text-dim:#969696;
    --stamp:#ffffff;
    --stamp-dim:#555555;
    --border:#2a2a2a;
    --border-light:#3d3d3d;
    --mono:-apple-system, BlinkMacSystemFont, 'Inter', 'Helvetica Neue', Arial, sans-serif;
    --display:-apple-system, BlinkMacSystemFont, 'Inter', 'Helvetica Neue', Arial, sans-serif;
  }
  *{box-sizing:border-box;}
  html,body{height:100%;}
  body{
    margin:0; background:var(--bg); color:var(--text); min-height:100%;
    font-family:var(--mono); font-weight:600; -webkit-font-smoothing:antialiased;
  }
  a{color:inherit; text-decoration:none;}
  ::selection{background:var(--stamp); color:#111111;}
  :focus-visible{outline:2px solid var(--stamp); outline-offset:2px;}

  /* ---------- ambient background: starfield canvas (same as stats.html) ---------- */
  .star-canvas{position:fixed; inset:0; width:100%; height:100%; z-index:0; pointer-events:none; display:block;}

  .notfound{
    position:relative; z-index:1; min-height:100vh;
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    text-align:center; padding:32px 24px; gap:0;
  }

  /* The "missing file" plate reuses the exact hazard-stripe pattern
     index.html shows for an album with no cover on file — same idea,
     scaled up: this whole page is the thing that's missing. */
  .file-plate{
    width:100%; max-width:300px; height:130px; border-radius:8px;
    background:repeating-linear-gradient(45deg, var(--bg-elevated), var(--bg-elevated) 9px, #23232380 9px, #23232480 18px);
    box-shadow:0 10px 30px rgba(0,0,0,.45);
    display:flex; align-items:center; justify-content:center; margin-bottom:26px;
  }
  .file-plate-num{
    font-family:var(--display); font-weight:900; font-size:2.6rem; letter-spacing:.02em;
    color:var(--stamp); background:rgba(17,17,17,.72); padding:6px 22px; border-radius:5px;
  }

  .eyebrow{
    font-size:.68rem; letter-spacing:.12em; text-transform:uppercase; color:var(--text-dim);
    margin:0 0 12px;
  }
  h1{
    font-family:var(--display); font-weight:800; font-size:1.5rem; letter-spacing:-.005em;
    margin:0; max-width:24ch; line-height:1.3;
  }
  .lede{
    color:var(--text-dim); font-weight:500; font-size:.86rem; line-height:1.6;
    max-width:42ch; margin:14px 0 0;
  }

  .redirect-block{margin:32px 0 26px;}
  .redirect-text{font-size:.78rem; color:var(--text-dim); margin:0;}
  .redirect-text b{color:var(--text); font-weight:700; font-variant-numeric:tabular-nums;}
  .redirect-bar{width:200px; height:3px; background:var(--border); border-radius:2px; overflow:hidden; margin:12px auto 0;}
  .redirect-bar-fill{height:100%; width:100%; background:var(--stamp);}
  @media (prefers-reduced-motion: reduce){ .redirect-bar{display:none;} }

  .back-link{
    display:inline-flex; align-items:center; gap:7px;
    padding:9px 16px; background:var(--bg-elevated); color:var(--text);
    border:1px solid var(--border-light); border-radius:3px;
    font-family:var(--mono); font-size:.76rem; font-weight:600; letter-spacing:.02em;
    cursor:pointer; transition:color .15s ease, border-color .15s ease, transform .15s ease;
  }
  .back-link:hover{color:var(--stamp); border-color:var(--stamp); transform:translateX(-2px);}
  .back-link svg{width:14px; height:14px; flex-shrink:0; display:block;}

  @media (max-width:480px){
    .file-plate{max-width:240px; height:110px;}
    .file-plate-num{font-size:2.1rem; padding:5px 16px;}
    h1{font-size:1.25rem;}
  }
</style>
</head>
<body>

<canvas class="star-canvas" id="starCanvas" aria-hidden="true"></canvas>

<script>
/* =====================================================================
   Starfield background — identical to the one on stats.html. Kept
   self-contained on purpose so it can be copy-pasted between pages
   without dragging any page-specific code along with it. Hover your
   cursor near a star and a line snaps to it.
   ===================================================================== */
(function(){
  const canvas = document.getElementById('starCanvas');
  const ctx = canvas.getContext('2d');
  const reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  let width, height, stars = [];
  const mouse = { x: null, y: null };

  const STAR_COUNT = 45;
  const CONNECTION_DISTANCE = 150;
  const MOUSE_CONNECTION_DISTANCE = 190;
  const CONNECTION_DISTANCE_SQ = CONNECTION_DISTANCE * CONNECTION_DISTANCE;
  const MOUSE_CONNECTION_DISTANCE_SQ = MOUSE_CONNECTION_DISTANCE * MOUSE_CONNECTION_DISTANCE;

  function resize(){
    const dpr = window.devicePixelRatio || 1;
    canvas.width = window.innerWidth * dpr;
    canvas.height = window.innerHeight * dpr;
    canvas.style.width = window.innerWidth + 'px';
    canvas.style.height = window.innerHeight + 'px';
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    width = window.innerWidth;
    height = window.innerHeight;
    createStars();
  }

  function createStars(){
    stars = [];
    for (let i = 0; i < STAR_COUNT; i++){
      const angle = Math.random() * Math.PI * 2;
      const speed = Math.random() * 0.14 + 0.04;
      stars.push({
        x: Math.random() * width,
        y: Math.random() * height,
        radius: Math.random() * 1.1 + 0.35,
        vx: Math.cos(angle) * speed,
        vy: Math.sin(angle) * speed,
        drift: Math.random() * Math.PI * 2,
        driftSpeed: Math.random() * 0.0008 + 0.0003,
        alpha: Math.random() * 0.35 + 0.5,
        twinkleSpeed: Math.random() * 0.0015 + 0.0005,
        twinkleOffset: Math.random() * Math.PI * 2
      });
    }
  }

  function drawStars(time){
    for (const star of stars){
      if (!reduceMotion){
        star.drift += star.driftSpeed;
        star.x += star.vx + Math.cos(star.drift) * 0.02;
        star.y += star.vy + Math.sin(star.drift) * 0.02;

        if (star.x < -20) star.x = width + 20;
        if (star.x > width + 20) star.x = -20;
        if (star.y < -20) star.y = height + 20;
        if (star.y > height + 20) star.y = -20;
      }

      const twinkle = reduceMotion ? 0 : Math.sin(time * star.twinkleSpeed + star.twinkleOffset) * 0.06;
      const alpha = Math.max(0.35, Math.min(0.9, star.alpha + twinkle));

      ctx.beginPath();
      ctx.arc(star.x, star.y, star.radius, 0, Math.PI * 2);
      ctx.fillStyle = `rgba(220,230,255,${alpha})`;
      ctx.fill();
    }
  }

  function drawStarConnections(){
    for (let i = 0; i < stars.length; i++){
      const a = stars[i];
      for (let j = i + 1; j < stars.length; j++){
        const b = stars[j];
        const dx = a.x - b.x;
        const dy = a.y - b.y;
        const distSq = dx * dx + dy * dy;
        if (distSq >= CONNECTION_DISTANCE_SQ) continue;

        const d = Math.sqrt(distSq);
        const opacity = Math.pow(1 - d / CONNECTION_DISTANCE, 2) * 0.12;

        ctx.beginPath();
        ctx.moveTo(a.x, a.y);
        ctx.lineTo(b.x, b.y);
        ctx.strokeStyle = `rgba(150,180,255,${opacity})`;
        ctx.lineWidth = 0.5;
        ctx.stroke();
      }
    }
  }

  function drawMouseConnections(){
    if (mouse.x === null || mouse.y === null) return;

    for (const star of stars){
      const dx = mouse.x - star.x;
      const dy = mouse.y - star.y;
      const distSq = dx * dx + dy * dy;
      if (distSq >= MOUSE_CONNECTION_DISTANCE_SQ) continue;

      const d = Math.sqrt(distSq);
      const strength = Math.pow(1 - d / MOUSE_CONNECTION_DISTANCE, 2);

      ctx.beginPath();
      ctx.arc(star.x, star.y, star.radius + strength * 3, 0, Math.PI * 2);
      ctx.fillStyle = `rgba(190,215,255,${strength * 0.3})`;
      ctx.fill();

      ctx.beginPath();
      ctx.moveTo(mouse.x, mouse.y);
      ctx.lineTo(star.x, star.y);
      ctx.strokeStyle = `rgba(170,200,255,${strength * 0.65})`;
      ctx.lineWidth = 0.7 + strength * 0.6;
      ctx.stroke();
    }
  }

  let rafId = null;
  function animate(time){
    ctx.clearRect(0, 0, width, height);
    drawStars(time);
    drawStarConnections();
    drawMouseConnections();
    rafId = requestAnimationFrame(animate);
  }

  document.addEventListener('visibilitychange', () => {
    if (document.hidden){
      if (rafId !== null){ cancelAnimationFrame(rafId); rafId = null; }
    } else if (rafId === null){
      rafId = requestAnimationFrame(animate);
    }
  });

  window.addEventListener('mousemove', (e) => { mouse.x = e.clientX; mouse.y = e.clientY; });
  window.addEventListener('mouseleave', () => { mouse.x = null; mouse.y = null; });
  window.addEventListener('resize', resize);

  resize();
  rafId = requestAnimationFrame(animate);
})();
</script>

<main class="notfound">
  <div class="file-plate" aria-hidden="true"><span class="file-plate-num">404</span></div>

  <p class="eyebrow">Case File — Not Found</p>
  <h1>This page isn't in the archive.</h1>
  <p class="lede">Whatever you were looking for got moved, renamed, or never existed here.</p>

  <div class="redirect-block">
    <p class="redirect-text">Taking you back to the archive in <b id="countdownNum">5</b>s…</p>
    <div class="redirect-bar"><div class="redirect-bar-fill" id="redirectFill"></div></div>
  </div>

  <a href="index.html" class="back-link">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="19" y1="12" x2="5" y2="12"></line><polyline points="12 19 5 12 12 5"></polyline></svg>
    Back to Archive now
  </a>
</main>

<script>
/* =====================================================================
   Auto-redirect. The <meta http-equiv="refresh"> tag in <head> is the
   safety net for no-JS browsers/crawlers; this drives the visible
   countdown + progress bar and fires the actual redirect a beat sooner
   so the two never race each other.
   ===================================================================== */
const REDIRECT_SECONDS = 5;
const REDIRECT_TARGET = 'index.html';

let secondsLeft = REDIRECT_SECONDS;
const countdownEl = document.getElementById('countdownNum');

function tick(){
  secondsLeft--;
  if (secondsLeft <= 0) {
    window.location.replace(REDIRECT_TARGET);
    return;
  }
  countdownEl.textContent = secondsLeft;
  setTimeout(tick, 1000);
}
setTimeout(tick, 1000);

// Drain the progress bar over the same window. Set to full width first,
// then flip it to 0% one frame later so the transition actually has a
// starting point to animate from instead of snapping straight to empty.
const fillEl = document.getElementById('redirectFill');
fillEl.style.transition = `width ${REDIRECT_SECONDS}s linear`;
requestAnimationFrame(() => requestAnimationFrame(() => { fillEl.style.width = '0%'; }));
</script>

</body>
</html>
